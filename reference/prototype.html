let recState=null;
function pickVideoMime(){
  if (!window.MediaRecorder) return null;
  const types=['video/mp4;codecs=avc1.640028','video/mp4;codecs=avc1.4D401F','video/mp4;codecs=avc1.42E01E','video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'];

async function recordVideo(){
  const mime=pickVideoMime();
  if (!mime || !canvas.captureStream){ toast('L’enregistrement vidéo n’est pas disponible dans ce navigateur.'); return; }
  const isImg=S.app==='image';
  if (isImg && (imgDirty || !imgSets.length)) buildImageSets();
  const dur=isImg ? imgLoopDur() : S.videoDur;
  const wasPaused=S.paused; S.paused=false; syncPlay();
  recording=true; resize();
  if (isImg) imgTime=0;                       // une boucle complète, du début à la fin
  const build=!isImg && S.videoBuild;
  if (build){ drawP=0; lobes=[]; lineLobes=[]; syn=[]; synAcc=0; spawnAcc=0; links=[]; }   // la forme repart de zéro
  await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
  const stream=canvas.captureStream(60);
  let rec;
  try { rec=new MediaRecorder(stream,{mimeType:mime, videoBitsPerSecond:Math.round(Math.min(40e6, Math.max(16e6, canvas.width*canvas.height*8)))}); }
  catch(e){ rec=new MediaRecorder(stream); }
  const chunks=[]; rec.ondataavailable=e=>{ if (e.data && e.data.size) chunks.push(e.data); };
  const stopped=new Promise(r=>{ rec.onstop=r; });
  recState={t:0, dur, done:null, build, tail:0};
  const finished=new Promise(r=>{ recState.done=r; });
  rec.start(500);
  toast(build?'Enregistrement de la construction…':'Enregistrement… 0 / '+Math.round(dur)+' s');
  await finished;
  rec.stop(); await stopped;
  stream.getTracks().forEach(t=>t.stop());
  recState=null; recording=false; resize();
  S.paused=wasPaused; syncPlay();
  const isMp4=/mp4/.test(rec.mimeType||mime);
  const blob=new Blob(chunks,{type:isMp4?'video/mp4':'video/webm'});
  if (!blob.size){ toast('La vidéo est vide : réessaie avec l’onglet au premier plan.'); return; }
  await saveFile(`brand-hub-co-labs-${stamp()}.${isMp4?'mp4':'webm'}`, blob);
  if (!isMp4) toast('Ce navigateur enregistre en WebM (pas en MP4). Pour un MP4, utilise Chrome récent ou Safari.');
}

// ---------- rendu des motifs (aperçus) ----------
let dlTickNo=0;
function libreTick(dt, now){
  if (DL.exporting) return;
  dlTickNo++;
  const vw=dlVp.clientWidth, vh=dlVp.clientHeight, dpr=Math.min(2, window.devicePixelRatio||1);
  const list=[]; DL.doc.frames.forEach(F=>F.children.forEach(L=>{ if (L.type==='pattern' && !L.hidden) list.push([L,F]); }));
  const nAnim=list.filter(([L])=>L.anim).length, every=nAnim>2?Math.ceil(nAnim/2):1;
  list.forEach(([L,F],i)=>{
    L._acc=(L._acc||0)+dt;
    const live=L===DL.live;
    const r=layerScreen(L,F), ext=Math.hypot(r.w,r.h)/2;
    if (r.cx+ext<0 || r.cx-ext>vw || r.cy+ext<0 || r.cy-ext>vh) return;
    // l'aperçu est calculé comme l'export (pleine densité, au moins à la taille réelle jusqu'à 1400 px),
    // puis affiché réduit : ce qu'on voit dans le frame est ce qu'on exporte
    const cap=Math.min(2048, renderer.capabilities.maxTextureSize);
    let pw=Math.max(r.w*dpr, Math.min(L.w,1400)), ph=pw*L.h/L.w;
    const k=Math.min(1, cap/Math.max(pw,ph)); pw=Math.max(4,Math.round(pw*k)); ph=Math.max(4,Math.round(ph*k));
    const cv=L._cv||(L._cv=document.createElement('canvas'));
    if (Math.abs(cv.width-pw)>pw*0.12 || Math.abs(cv.height/cv.width-ph/pw)>0.01 || !cv.width){ cv.width=pw; cv.height=ph; L.dirty=true; }
    const turn=(L.anim||live) && ((dlTickNo+i)%every===0);
    if (!turn && !L.dirty) return;
    if (live && imgDirty && L.eng){ L.eng.imgDirty=true; imgDirty=false; }
    QMUL=1;
    const step=L.anim?Math.min(0.1,L._acc):0; L._acc=0;
    renderLayerTo(L, live, cv.width, cv.height, step, cv.getContext('2d'));
    L.dirty=false;
  });
}

function zoomAt(sx,sy,f){ const v=DL.view, z=Math.min(8,Math.max(0.02,v.z*f)); const [wx,wy]=s2w(sx,sy); v.z=z; v.x=sx-wx*z; v.y=sy-wy*z; dlApplyView(); }

  const f=dlFind(id); if (f && f.node.type==='pattern'){ select(f.node.id); enter3d(); }
  else if (!f){ const [sx,sy]=vpPt(e); const [wx,wy]=s2w(sx,sy); const F=frameAt(wx,wy); if (F){ const c=[...F.children].reverse().find(c=>{ const lx=wx-F.x, ly=wy-F.y; return lx>=c.x&&lx<=c.x+c.w&&ly>=c.y&&ly<=c.y+c.h; }); if (c && c.type==='pattern'){ select(c.id); enter3d(); } } }
});
function renameFrame(F, hd){
  const inp=el('input',{type:'text',class:'dlren',value:F.name,maxlength:'40','aria-label':'Nom du frame'});
  inp.style.cssText=hd.getAttribute('style')||''; hd.replaceWith(inp); inp.focus(); inp.select();
  const done=ok=>{ if (ok){ F.name=inp.value.trim()||F.name; commit(); } dlRenderUi(); dlRenderPanel(); };
  inp.addEventListener('keydown',ev=>{ ev.stopPropagation(); if (ev.key==='Enter') done(true); if (ev.key==='Escape') done(false); });
  inp.addEventListener('blur',()=>done(true));

dlVp.addEventListener('pointerdown',e=>{
  if (e.target.closest('.dl-tools,.dl-zoom,.dl-empty,.dlren')) return;
  const [sx,sy]=vpPt(e), [wx,wy]=s2w(sx,sy);
  dlVp.setPointerCapture(e.pointerId);
  if (DL.tool==='hand' || DL.space || e.button===1){ act={k:'pan', sx, sy, vx:DL.view.x, vy:DL.view.y}; dlVp.classList.add('panning'); return; }

  if (DL.tool==='frame'||DL.tool==='shape'||(DL.tool==='insert' && DL.ins!=='file')){ act={k:'draw', tool:DL.tool==='insert'?DL.ins:DL.tool, wx0:wx, wy0:wy, wx, wy}; return; }
  if (DL.tool==='insert'){ const F=frameAt(wx,wy); if (F) select(F.id); dlFile.click(); setTool('move'); return; }
  const t=e.target, h=t.dataset&&t.dataset.h;
  const n=selNode();
  if (h && n){ const F=selFrame(); act={k:h==='rot'?'rot':'size', h, n, F, wx0:wx, wy0:wy, o:{x:n.x,y:n.y,w:n.w,h:n.h,r:n.r||0}, kids:isFrame(n)?n.children.map(c=>({c,x:c.x,y:c.y})):null}; return; }

  if (!f){ select(null); act={k:'pan', sx, sy, vx:DL.view.x, vy:DL.view.y, soft:true}; return; }
  select(f.node.id);

});
dlVp.addEventListener('pointermove',e=>{
  if (!act) return;
  const [sx,sy]=vpPt(e), [wx,wy]=s2w(sx,sy);
  if (act.k==='pan'){ DL.view.x=act.vx+(sx-act.sx); DL.view.y=act.vy+(sy-act.sy); dlApplyView(true); return; }
  if (act.k==='draw'){ act.wx=wx; act.wy=wy; drawGhost(act); return; }
  if (act.k==='orbit'){
    const L=act.L, dx=sx-act.sx, dy=sy-act.sy; act.sx=sx; act.sy=sy; L.cam=L.cam||{theta:0,phi:Math.PI/2,radius:62,tx:0,ty:0,tz:0};
    if (act.pan||e.shiftKey){ const F=dlFind(L.id).frame, r=layerScreen(L,F), z=Math.max(1,L.zoom||1); L.pan=L.pan||[0,0]; L.pan[0]-=dx/(r.w*z); L.pan[1]-=dy/(r.h*z); clampPan(L); }
    else { L.cam.theta-=dx*0.007; L.cam.phi=Math.min(Math.PI-0.05,Math.max(0.05,L.cam.phi-dy*0.007)); }
    L.dirty=true; return;

      const cx=nx+n.w/2, cy=ny+n.h/2;
      if (Math.abs(cx-F.w/2)<sn){ nx=F.w/2-n.w/2; guide(F.x+F.w/2,F.y,0,F.h); }
      if (Math.abs(cy-F.h/2)<sn){ ny=F.h/2-n.h/2; guide(F.x,F.y+F.h/2,F.w,0); }
      if (Math.abs(nx)<sn) nx=0; if (Math.abs(ny)<sn) ny=0; if (Math.abs(nx+n.w-F.w)<sn) nx=F.w-n.w; if (Math.abs(ny+n.h-F.h)<sn) ny=F.h-n.h;

    const n=act.n, o=act.o, h=act.h, hx=h.includes('e')?1:h.includes('w')?-1:0, hy=h.includes('s')?1:h.includes('n')?-1:0;
    const a=-(o.r)*Math.PI/180, dx=wx-act.wx0, dy=wy-act.wy0, lx=dx*Math.cos(a)-dy*Math.sin(a), ly=dx*Math.sin(a)+dy*Math.cos(a);

    if (isFrame(n) && act.kids){ const ddx=n.x-o.x, ddy=n.y-o.y; act.kids.forEach(k=>{ k.c.x=k.x-ddx; k.c.y=k.y-ddy; }); }

    return;
  }

    const n=act.n, F=act.F, r=layerScreen(n,F); const a0=Math.atan2(act.wy0*DL.view.z+DL.view.y-r.cy, act.wx0*DL.view.z+DL.view.x-r.cx), a1=Math.atan2(sy-r.cy, sx-r.cx);

  }
});

    let x0=Math.min(a.wx0,a.wx), y0=Math.min(a.wy0,a.wy), w=Math.abs(a.wx-a.wx0), h=Math.abs(a.wy-a.wy0);

    inp.addEventListener('change',()=>{ S.videoDur=Math.max(2,Math.min(60,parseFloat(inp.value)||8)); inp.value=S.videoDur; });
    inp.addEventListener('keydown',e=>e.stopPropagation());
    d.appendChild(el('label',{class:'dk-num'},[el('span',{text:'Durée'}),inp,el('span',{text:'s'})]));
    d.appendChild(el('span',{class:'dk-note',text:'Les motifs animés du frame, en MP4 (1920 px de côté au plus).'}));
  }
  const go=el('button',{type:'button',class:'cta'},[el('span',{class:'cta-ico',text:'=>'}),el('span',{class:'cta-l',text:(S.dlTab|0)===0?'Exporter l’image':'Enregistrer la vidéo'})]);
  go.disabled=dockBusy||!F; go.addEventListener('click',()=>runDock((S.dlTab|0)===0?exportFrameImage:exportFrameVideo));
  d.appendChild(go);
}

// ---------- menu de gauche ----------
const isMobile=()=>window.matchMedia('(max-width:720px)').matches;
document.getElementById('railToggle').addEventListener('click',()=>{ if (isMobile()) document.body.classList.remove('rail-show'); else document.body.classList.add('rail-off'); setTimeout(resize,280); });
document.getElementById('railOpen').addEventListener('click',()=>{ if (isMobile()) document.body.classList.add('rail-show'); else document.body.classList.remove('rail-off'); setTimeout(resize,280); });
document.querySelectorAll('.rail-item[data-soon]').forEach(b=>b.addEventListener('click',()=>toast('La partie « '+b.dataset.soon+' » arrive à l’étape suivante.')));
// ---------- export : fenêtre au-dessus du bouton ----------
const exportBtn=document.getElementById('exportBtn'), exportFab=document.getElementById('exportFab');
function setExportOpen(open){
  dock.hidden=!open; exportBtn.setAttribute('aria-expanded',String(open)); exportFab.setAttribute('aria-expanded',String(open));
  if (open){ renderDock(); const r=(exportBtn.offsetParent && !panel.classList.contains('hidden') ? exportBtn : exportFab).getBoundingClientRect(); dock.style.bottom=(window.innerHeight-r.top+8)+'px'; dock.style.right=Math.max(8,window.innerWidth-r.right)+'px'; }
}
exportBtn.addEventListener('click',e=>{ e.stopPropagation(); setExportOpen(dock.hidden); });
exportFab.addEventListener('click',e=>{ e.stopPropagation(); setExportOpen(dock.hidden); });
document.addEventListener('pointerdown',e=>{ if (!dock.hidden && !dock.contains(e.target) && e.target!==exportBtn && e.target!==exportFab && !exportBtn.contains(e.target) && !exportFab.contains(e.target)) setExportOpen(false); });
document.addEventListener('keydown',e=>{ if (e.key==='Escape' && !dock.hidden){ setExportOpen(false); exportBtn.focus(); } });
// ---------- préréglage choisi sur la scène ----------
document.getElementById('presetSel').addEventListener('change',e=>{
  const p=presets.find(q=>q.id===e.target.value); if (!p) return;
  e.target.dataset.cur=p.id; applySettings(p.s); toast('Préréglage appliqué : '+p.name);
});
window.addEventListener('dragover',e=>{ if (e.dataTransfer && [...e.dataTransfer.items||[]].some(i=>i.kind==='file')){ e.preventDefault(); document.body.classList.add('dropping'); } });
window.addEventListener('dragleave',e=>{ if (e.target===document.documentElement || e.clientX<=0 || e.clientY<=0) document.body.classList.remove('dropping'); });
window.addEventListener('drop',e=>{ document.body.classList.remove('dropping'); if (!e.dataTransfer || !e.dataTransfer.files.length) return; e.preventDefault(); if (S.app==='libre'){ importLayerFiles(e.dataTransfer.files); return; } switchApp('image'); addImages(e.dataTransfer.files); });
syncPlay(); refreshColors(); syncColorsUI(); regenerate(); resetView(); syncVariantUI();
const DEFAULT_SETTINGS=settingsGet();   // réglages d'origine, avant tout préréglage
initPresets();
loadLibrary();
if (window.innerWidth<=720) setPanel(false); else resize();
requestAnimationFrame(frame);
})();
</script>
