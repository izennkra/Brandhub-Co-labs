<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --orange:#EF6216;
  --panel-bg:rgba(235,227,219,.94);
  --panel-ink:#431602;
  --panel-soft:rgba(67,22,2,.55);
  --panel-line:rgba(67,22,2,.15);
  --track:rgba(67,22,2,.22);
  --focus:#EF6216;
  --font:"Familjen Grotesk","Helvetica Neue",Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --panel-bg:rgba(46,15,2,.93); --panel-ink:#EBE3DB; --panel-soft:rgba(235,227,219,.6);
    --panel-line:rgba(235,227,219,.16); --track:rgba(235,227,219,.25);
  }
}
:root[data-theme="dark"]{
  --panel-bg:rgba(46,15,2,.93); --panel-ink:#EBE3DB; --panel-soft:rgba(235,227,219,.6);
  --panel-line:rgba(235,227,219,.16); --track:rgba(235,227,219,.25);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;height:100%;overflow:hidden}
body{background:#C2B1A2;font-family:var(--font);color:var(--panel-ink);-webkit-font-smoothing:antialiased}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#scene.dragging{cursor:grabbing}

.mark{position:fixed;left:24px;top:calc(18px + env(safe-area-inset-top,0px));pointer-events:none;color:var(--mark-ink,#431602);transition:color .4s}
.mark h1{margin:0;font-size:clamp(28px,4vw,44px);font-weight:600;letter-spacing:-.035em;line-height:1}
.mark p{margin:6px 0 0;font-size:13px;opacity:.7;max-width:34ch;line-height:1.35}
.hint{position:fixed;left:24px;bottom:calc(20px + env(safe-area-inset-bottom,0px));font-size:12px;color:var(--mark-ink,#431602);opacity:.6;pointer-events:none;transition:color .4s}

.panel{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));width:300px;
  background:var(--panel-bg);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-radius:22px;display:flex;flex-direction:column;overflow:hidden;overflow:clip;transition:transform .35s cubic-bezier(.2,.8,.2,1),opacity .3s}
.panel-head,.appseg,.panel-foot{flex:none}
.panel-scroll{min-height:0}
.panel.hidden{transform:translateX(calc(100% + 24px));opacity:0;pointer-events:none}
.panel-head{display:flex;gap:8px;padding:14px 14px 12px;border-bottom:1px solid var(--panel-line)}
.panel-scroll{overflow-y:auto;overflow-x:hidden;padding:4px 18px 18px;flex:1;scrollbar-width:thin}
.panel-foot{padding:10px 18px 14px;border-top:1px solid var(--panel-line);font-size:11.5px;color:var(--panel-soft);line-height:1.5}

.btn{flex:1;font:inherit;font-size:13px;font-weight:600;border:0;border-radius:999px;padding:9px 10px;cursor:pointer;
  background:var(--panel-ink);color:var(--panel-bg);display:flex;align-items:center;justify-content:center;gap:7px;min-height:36px}
.btn.ghost{background:transparent;color:var(--panel-ink);box-shadow:inset 0 0 0 1.5px var(--panel-ink)}
.btn.icon{flex:0 0 36px;padding:0}
.btn svg{width:14px;height:14px;fill:currentColor}
.btn:focus-visible,.seg button:focus-visible,.pair:focus-visible,.chip:focus-visible,input[type=range]:focus-visible,.toggle input:focus-visible+.track,.toggleBtn:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

.group{padding-top:16px}
.group h2{margin:0 0 8px;font-size:15px;font-weight:600;letter-spacing:-.01em}
.row{margin:10px 0 0}
.row-top{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;margin-bottom:4px}
.row-top span:last-child{font-variant-numeric:tabular-nums;color:var(--panel-soft)}
.sub{font-size:12.5px;margin:12px 0 6px}
.note{font-size:11.5px;color:var(--panel-soft);margin:6px 0 0;line-height:1.4}

input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:20px;background:transparent;margin:0;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:var(--track);border-radius:2px}
input[type=range]::-moz-range-track{height:2px;background:var(--track);border-radius:2px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:12px;margin-top:-5px;border-radius:6px;background:var(--panel-ink)}
input[type=range]::-moz-range-thumb{width:22px;height:12px;border:0;border-radius:6px;background:var(--panel-ink)}

.seg{display:flex;background:var(--panel-line);border-radius:999px;padding:3px;gap:2px}
.seg button{flex:1;font:inherit;font-size:12.5px;border:0;background:transparent;color:var(--panel-ink);border-radius:999px;padding:6px 4px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--panel-ink);color:var(--panel-bg);font-weight:600}

/* Associations fond / pastille, lues comme dans la planche couleur */
.pairs{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.pair{aspect-ratio:1;border-radius:50%;border:0;padding:0;cursor:pointer;background:var(--o);position:relative;box-shadow:inset 0 0 0 1px rgba(67,22,2,.14)}
.pair::before{content:"";position:absolute;inset:27%;border-radius:50%;background:var(--i)}
.pair[aria-pressed="true"]{box-shadow:0 0 0 2px var(--panel-bg),0 0 0 3.5px var(--panel-ink)}
.pair.ref{aspect-ratio:auto;width:100%;height:30px;border-radius:999px;display:flex;align-items:center;gap:10px;padding:0 6px;margin-bottom:8px;font:inherit;font-size:12.5px;color:#431602}
.pair.ref::before{display:none}
.pair.ref span{width:34px;height:12px;border-radius:999px;background:var(--i);flex:none}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:12px;border:0;border-radius:999px;padding:5px 10px 5px 6px;cursor:pointer;display:flex;align-items:center;gap:6px;
  background:transparent;color:var(--panel-ink);box-shadow:inset 0 0 0 1.5px var(--panel-line)}
.chip b{width:18px;height:10px;border-radius:5px;background:var(--c);box-shadow:inset 0 0 0 1px rgba(67,22,2,.15)}
.chip[aria-pressed="true"]{box-shadow:inset 0 0 0 1.5px var(--panel-ink);font-weight:600}
.psave{display:flex;gap:6px}
.psave input{flex:1;min-width:0;font:inherit;font-size:13px;color:var(--panel-ink);background:transparent;border:0;border-radius:999px;padding:8px 12px;box-shadow:inset 0 0 0 1.5px var(--panel-line)}
.psave input:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.psave .xbtn{padding:8px 14px;background:var(--panel-ink);color:var(--panel-bg)}
.plist{display:flex;flex-direction:column;gap:4px;margin-top:10px}
.pitem{display:flex;align-items:center;gap:4px;border-radius:12px;background:var(--panel-line)}
.pitem .pname{flex:1;min-width:0;text-align:left;font:inherit;font-size:13px;color:var(--panel-ink);background:transparent;border:0;padding:8px 10px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pitem .pname small{display:block;font-size:11px;color:var(--panel-soft)}
.pitem .pic{flex:none;width:30px;height:30px;border:0;border-radius:50%;background:transparent;color:var(--panel-ink);cursor:pointer;font:inherit;font-size:15px;line-height:1}
.pitem .pic.on{color:var(--orange)}
.pitem .pic.warn{background:var(--orange);color:#fff;width:auto;padding:0 10px;border-radius:999px;font-size:12px}
.pitem button:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.pempty{font-size:12px;color:var(--panel-soft);margin:8px 0 0}

.toggle{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;margin-top:12px;cursor:pointer}
.toggle input{position:absolute;opacity:0;pointer-events:none}
.toggle .track{width:34px;height:20px;border-radius:999px;background:var(--track);position:relative;transition:background .2s}
.toggle .track::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:var(--panel-bg);transition:transform .2s}
.toggle input:checked+.track{background:var(--orange)}
.toggle input:checked+.track::after{transform:translateX(14px)}

.exports{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.xbtn{font:inherit;font-size:13px;font-weight:600;border:0;border-radius:999px;padding:8px 0;cursor:pointer;background:var(--panel-line);color:var(--panel-ink)}
.xbtn.wide{grid-column:1/-1;background:var(--panel-ink);color:var(--panel-bg)}
.xbtn:disabled{opacity:.5;cursor:progress}
.xbtn:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;
  background:#431602;color:#EBE3DB;font-size:13px;padding:10px 16px;border-radius:999px;transition:opacity .25s,transform .25s;z-index:10;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.lbl{position:absolute;left:0;top:0;transform:translate(-50%,-100%);font-family:var(--font);font-weight:600;font-size:15px;letter-spacing:-.01em;color:var(--mark-ink,#431602);white-space:nowrap;font-variant-numeric:tabular-nums;transition:color .4s}
.lbl small{display:block;font-weight:400;font-size:12px;opacity:.75;text-align:center}
.lineIn{width:100%;font:inherit;font-size:13px;color:var(--panel-ink);background:transparent;border:0;border-radius:12px;padding:8px 12px;box-shadow:inset 0 0 0 1.5px var(--panel-line)}
.lineIn:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.xbtn[aria-pressed="true"]{background:var(--orange);color:#fff}
.panel *,.panel *::before,.panel *::after{box-sizing:border-box}
.group{padding-top:0;border-bottom:1px solid var(--panel-line)}
details.group>summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;padding:14px 0;user-select:none}
details.group>summary::-webkit-details-marker,details.subg>summary::-webkit-details-marker{display:none}
details.group>summary h2{margin:0}
details.group>summary::after,details.subg>summary::after{content:"";width:8px;height:8px;border-right:1.6px solid currentColor;border-bottom:1.6px solid currentColor;transform:rotate(45deg) translate(-2px,-2px);transition:transform .2s;opacity:.7}
details[open].group>summary::after,details[open].subg>summary::after{transform:rotate(-135deg) translate(-2px,-2px)}
details.group>summary:focus-visible,details.subg>summary:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
.gbody{padding-bottom:16px}
details.subg{margin-top:12px;border-radius:14px;background:var(--panel-line);padding:0 12px}
details.subg>summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;padding:10px 0;font-size:13px;font-weight:600}
details.subg[open]{padding-bottom:12px}
.drow{background:var(--panel-bg);border-radius:12px;padding:10px;margin-top:8px}
.drow-h{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:600;margin-bottom:6px}
.drow-b{display:flex;gap:6px}
.drow-b .lineIn{flex:1;min-width:0}
.rnum-w{position:relative;flex:0 0 78px!important}
.rnum-w input{width:100%;padding-right:26px}
.rnum-w span{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:12px;opacity:.6;pointer-events:none}
.rdel{border:0;background:transparent;color:var(--panel-ink);font-size:17px;line-height:1;cursor:pointer;width:26px;height:26px;border-radius:50%}
.rdel:hover{background:var(--panel-line)}
.rdel:disabled{opacity:.3;cursor:default}
.addrow{margin-top:8px;width:100%;font:inherit;font-size:13px;font-weight:600;color:var(--panel-ink);background:transparent;border:1.5px dashed var(--track);border-radius:12px;padding:9px;cursor:pointer}
.addrow:hover{border-color:var(--panel-ink)}
.rdel:focus-visible,.addrow:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.appseg{margin:12px 14px 2px}
.appseg button{padding:8px 4px;font-size:13px}
.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:4px}
.thumb{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:#fff;box-shadow:inset 0 0 0 1px var(--panel-line)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb b{position:absolute;left:4px;bottom:4px;font-size:10px;font-weight:600;background:var(--panel-bg);color:var(--panel-ink);border-radius:999px;padding:1px 6px}
.thumb button{position:absolute;right:3px;top:3px;width:20px;height:20px;border:0;border-radius:50%;background:var(--panel-bg);color:var(--panel-ink);font-size:13px;line-height:1;cursor:pointer}
.thumb button:focus-visible{outline:2px solid var(--focus)}
.dropping #scene{outline:3px dashed var(--orange);outline-offset:-12px}
.toggleBtn{position:fixed;right:14px;top:calc(14px + env(safe-area-inset-top,0px));z-index:5;height:40px;padding:0 16px;border-radius:999px;border:0;cursor:pointer;
  background:#431602;color:#EBE3DB;font:inherit;font-weight:600;font-size:13px;display:none}
.toggleBtn.show{display:block}

@media (max-width:720px){
  .mark{left:16px} .mark p{display:none} .hint{display:none}
  .panel{top:auto;left:8px;right:8px;width:auto;height:min(58vh,540px);bottom:calc(8px + env(safe-area-inset-bottom,0px))}
  .panel.hidden{transform:translateY(calc(100% + 24px))}
}
@media (prefers-reduced-motion: reduce){ .panel,.toggle .track::after{transition:none} }

/* ======================= Interface (refonte) ======================= */
:root{ --panel-bg:rgba(247,241,236,.97); --row:rgba(67,22,4,.055); --row-fill:rgba(67,22,4,.085); --row-hov:rgba(67,22,4,.12); --seg-on:#fff; --handle:rgba(67,22,4,.38); }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --panel-bg:rgba(36,13,3,.94); --row:rgba(255,240,230,.06); --row-fill:rgba(255,240,230,.11); --row-hov:rgba(255,240,230,.16); --seg-on:rgba(255,240,230,.16); --handle:rgba(255,240,230,.55); } }
:root[data-theme="dark"]{ --panel-bg:rgba(36,13,3,.94); --row:rgba(255,240,230,.06); --row-fill:rgba(255,240,230,.11); --row-hov:rgba(255,240,230,.16); --seg-on:rgba(255,240,230,.16); --handle:rgba(255,240,230,.55); }
body{font-family:Geist,var(--font)}
.mark{top:calc(22px + env(safe-area-inset-top,0px))}
.mark h1{line-height:0}
.logo-svg{height:28px;width:auto;display:block}
.panel{border-radius:24px;box-shadow:0 24px 60px rgba(67,22,4,.16),0 0 0 1px rgba(67,22,4,.06);width:316px}
.panel-head{border-bottom:0;padding:14px 14px 8px}
.btn{border-radius:12px;min-height:38px;font-weight:600}
.btn.ghost{box-shadow:none;background:var(--row)}
.panel-scroll{padding:2px 14px 18px}
.appseg{margin:0 14px 8px}
.advsw{display:flex;align-items:center;justify-content:space-between;margin:0 14px 8px;padding:0 14px;height:38px;border-radius:12px;background:var(--row);font-size:12.5px;color:var(--panel-soft);cursor:pointer;flex:none}
.advsw input{position:absolute;opacity:0;pointer-events:none}
.advsw .track{width:32px;height:19px;border-radius:999px;background:var(--track);position:relative;transition:background .2s}
.advsw .track::after{content:"";position:absolute;top:2.5px;left:2.5px;width:14px;height:14px;border-radius:50%;background:var(--panel-bg);transition:transform .2s}
.advsw input:checked+.track{background:var(--orange)}
.advsw input:checked+.track::after{transform:translateX(13px)}
.advsw input:focus-visible+.track{outline:2px solid var(--focus);outline-offset:2px}
body:not(.expert) .adv{display:none!important}
.panel-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;border-top:1px solid var(--panel-line);padding:10px 16px 12px}
.resetbtn{font:inherit;font-size:11.5px;font-weight:600;color:var(--panel-ink);background:var(--row);border:0;border-radius:999px;padding:6px 10px;cursor:pointer;white-space:nowrap}
.resetbtn.warn{background:var(--orange);color:#fff}
.resetbtn:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
details.group{border-bottom:0}
details.group>summary{padding:16px 4px 8px}
details.group>summary h2{font-size:11.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--panel-soft)}
.gbody{display:flex;flex-direction:column;gap:6px;padding-bottom:6px}
.gbody>*{margin-top:0;margin-bottom:0}
.sub{font-size:12px;color:var(--panel-soft);margin:8px 4px 0}
.note{font-size:11.5px;margin:0 4px;line-height:1.45}
/* curseur façon « barre remplie » : libellé à gauche, valeur à droite */
.fs{position:relative;height:42px;border-radius:13px;background:var(--row);overflow:hidden;display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-size:13px;flex:none;transition:background .15s}
.fs-fill{position:absolute;left:0;top:0;bottom:0;background:var(--row-fill);pointer-events:none;transition:background .15s}
.fs-fill::after{content:"";position:absolute;right:9px;top:50%;width:2.5px;height:16px;margin-top:-8px;border-radius:2px;background:var(--handle)}
.fs-l{position:relative;color:var(--panel-soft);pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:66%}
.fs-v{position:relative;font-variant-numeric:tabular-nums;color:var(--panel-ink);pointer-events:none;font-weight:500;white-space:nowrap}
.fs input[type=range]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:ew-resize;margin:0}
.fs:hover .fs-fill{background:var(--row-hov)}
.fs:focus-within{box-shadow:inset 0 0 0 2px var(--focus)}
.toggle{height:42px;border-radius:13px;background:var(--row);padding:0 14px;margin:0;font-size:13px;flex:none}
.toggle>span:first-child{color:var(--panel-soft)}
.seg{background:var(--row);border-radius:13px;padding:4px;gap:3px}
.seg button{border-radius:10px;padding:8px 4px;font-size:12.5px;color:var(--panel-soft)}
.seg button[aria-pressed="true"]{background:var(--seg-on);color:var(--panel-ink);box-shadow:0 1px 3px rgba(67,22,4,.14);font-weight:600}
.chips{gap:5px}
.chip{background:var(--row);box-shadow:none;border-radius:11px;padding:7px 10px 7px 7px;font-size:12px}
.chip b{width:16px;height:16px;border-radius:50%}
.chip[aria-pressed="true"]{box-shadow:inset 0 0 0 1.5px var(--panel-ink);background:var(--seg-on)}
.addrow{border:0;background:var(--row);border-radius:13px;padding:11px;color:var(--panel-ink)}
.addrow:hover{background:var(--row-hov)}
details.subg{background:transparent;border:1px solid var(--panel-line);border-radius:16px;padding:0 10px;margin-top:2px}
details.subg>summary{font-size:12.5px;padding:12px 4px}
details.subg[open]{padding-bottom:10px}
details.subg>div{display:flex;flex-direction:column;gap:6px}
.drow{background:var(--row)}
.thumbs{grid-template-columns:repeat(3,1fr);gap:8px}
.thumb{border-radius:14px;box-shadow:none;background:#fff}
.thumb .tpick{all:unset;display:block;width:100%;height:100%;cursor:pointer}
.thumb .tpick img{width:100%;height:100%;object-fit:contain;display:block}
.thumb .tpick[aria-pressed="true"]{box-shadow:inset 0 0 0 3px var(--orange);border-radius:14px}
.thumb .tpick:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
.thumb .tdel{position:absolute;right:4px;top:4px}
.thumb .tloop{position:absolute;left:4px;top:4px;width:20px;height:20px;border:0;border-radius:50%;font-size:11px;line-height:1;cursor:pointer;background:var(--panel-bg);color:var(--panel-soft)}
.thumb .tloop[aria-pressed="true"]{background:var(--orange);color:#fff}
.selname{color:var(--panel-ink);font-weight:600}
.exports .xbtn{border-radius:11px;background:var(--row)}
.exports .xbtn.wide{background:var(--panel-ink);color:var(--panel-bg)}
.psave input{border-radius:12px;background:var(--row);box-shadow:none}
.pitem{background:var(--row);border-radius:13px}

/* ===================== Interface v3 : verre, rayons de la marque ===================== */
:root{ --r-lg:10px; --r-md:6px; --r-sm:4px; --glass:rgba(250,245,241,.74); --glass-brd:rgba(255,255,255,.65); --glass-sh:0 18px 50px rgba(67,22,4,.16),0 2px 6px rgba(67,22,4,.06);
  --row:rgba(67,22,4,.06); --row-fill:rgba(67,22,4,.10); --row-hov:rgba(67,22,4,.14); --seg-on:#fff; --handle:rgba(67,22,4,.45); --panel-ink:#2B1206; --panel-soft:rgba(43,18,6,.58); --panel-line:rgba(67,22,4,.10); --panel-bg:rgba(250,245,241,.95); }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --glass:rgba(34,13,4,.72); --glass-brd:rgba(255,235,220,.10); --row:rgba(255,240,230,.07); --row-fill:rgba(255,240,230,.13); --row-hov:rgba(255,240,230,.18); --seg-on:rgba(255,240,230,.18); --handle:rgba(255,240,230,.6); --panel-ink:#F4E9E1; --panel-soft:rgba(244,233,225,.62); --panel-line:rgba(255,240,230,.12); --panel-bg:rgba(34,13,4,.95); } }
.glass{background:var(--glass);backdrop-filter:blur(22px) saturate(1.5);-webkit-backdrop-filter:blur(22px) saturate(1.5);border:1px solid var(--glass-brd);box-shadow:var(--glass-sh)}
.hint{display:none}
/* barre du haut */
.topbar{position:fixed;z-index:6;top:calc(12px + env(safe-area-inset-top,0px));left:12px;right:12px;height:52px;border-radius:var(--r-lg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 10px 0 16px;color:var(--panel-ink)}
.tb-left{display:flex;align-items:center;min-width:0}
.tb-left .logo-svg{height:24px;width:auto;display:block;color:var(--panel-ink)}
.tabs{background:var(--row);border-radius:var(--r-md);padding:3px;gap:2px;flex:none}
.tabs button{padding:7px 16px;border-radius:var(--r-sm);font-size:13px;font-weight:500;color:var(--panel-soft)}
.tabs button[aria-pressed="true"]{background:var(--orange);color:#fff;box-shadow:0 2px 8px rgba(236,95,20,.35);font-weight:600}
.tb-right{display:flex;align-items:center;gap:6px}
.tbtn{font:inherit;font-size:12.5px;font-weight:600;color:var(--panel-ink);background:var(--row);border:0;border-radius:var(--r-sm);height:34px;padding:0 12px;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap}
.tbtn:hover{background:var(--row-hov)}
.tbtn svg{width:14px;height:14px;fill:currentColor}
.tbtn.icon{width:34px;padding:0;justify-content:center}
.tbtn.icon svg{fill:none}
.tbtn.warn{background:var(--orange);color:#fff}
.tbtn:focus-visible,.tabs button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.toggleBtn{display:none!important}.toggleBtn.show{display:flex!important}
.topbar .advsw{margin:0;height:34px;border-radius:var(--r-sm);padding:0 10px;gap:8px;background:var(--row);font-weight:600;font-size:12.5px;color:var(--panel-ink)}
/* panneau des réglages */
.panel{top:calc(76px + env(safe-area-inset-top,0px));right:12px;bottom:calc(84px + env(safe-area-inset-bottom,0px));width:316px;border-radius:var(--r-lg);box-shadow:var(--glass-sh)}
.panel-scroll{padding:4px 12px 16px}
.panel.hidden{transform:translateX(calc(100% + 24px))}
details.group>summary{padding:14px 4px 8px}
details.group>summary h2{color:var(--panel-ink);opacity:.6}
.fs,.toggle,.addrow,.drow,.pitem,.psave input{border-radius:var(--r-md)}
.fs{height:40px}
.seg{border-radius:var(--r-md)} .seg button{border-radius:var(--r-sm)}
details.subg{border-radius:var(--r-md)}
.thumb,.thumb .tpick[aria-pressed="true"]{border-radius:var(--r-md)}
.xbtn,.exports .xbtn{border-radius:var(--r-sm)}
/* bouton de la marque : flèche dans un carré brun */
.cta{display:inline-flex;align-items:stretch;border:0;padding:0;border-radius:var(--r-sm);overflow:hidden;background:var(--orange);color:#2B1206;font:inherit;font-weight:700;font-size:13px;cursor:pointer;height:38px;box-shadow:0 4px 14px rgba(236,95,20,.28)}
.cta-ico{display:flex;align-items:center;justify-content:center;width:38px;background:#431604;color:#EC5F14;font-weight:700;font-size:13px;letter-spacing:-.04em;flex:none}
.cta .cta-l{display:flex;align-items:center;padding:0 14px}
.cta:hover{filter:brightness(1.05)} .cta:disabled{opacity:.6;cursor:progress}
.cta:focus-visible{outline:2px solid var(--panel-ink);outline-offset:2px}
.cta.sec{background:var(--row);color:var(--panel-ink);box-shadow:none}
/* dock d'export */
.dock{position:fixed;z-index:5;bottom:calc(12px + env(safe-area-inset-bottom,0px));left:calc((100vw - 340px)/2);transform:translateX(-50%);border-radius:var(--r-lg);display:flex;align-items:center;gap:10px;padding:8px;color:var(--panel-ink);max-width:calc(100vw - 370px);flex-wrap:wrap;justify-content:center}
body.panel-off .dock{left:50%;max-width:calc(100vw - 24px)}
.dock .seg{background:var(--row)}
.dock .seg button{padding:7px 11px;font-size:12.5px}
.dock .dk-lbl{font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--panel-soft);padding:0 4px 0 6px}
.dock .dk-sep{width:1px;height:26px;background:var(--panel-line)}
.dock .dk-opts{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dock .dk-num{display:flex;align-items:center;gap:6px;font-size:12.5px;background:var(--row);border-radius:var(--r-md);height:34px;padding:0 10px}
.dock .dk-num input{width:44px;font:inherit;border:0;background:transparent;color:var(--panel-ink);text-align:right}
.dock .advsw,.dock .chk{margin:0;height:34px;border-radius:var(--r-md);padding:0 10px;gap:8px;background:var(--row);font-size:12.5px;color:var(--panel-ink)}
.dock .dk-note{font-size:11.5px;color:var(--panel-soft);max-width:240px;line-height:1.35}
/* contact */
.contact{position:fixed;z-index:5;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));width:316px;height:60px;border-radius:var(--r-lg);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 10px 0 16px;color:var(--panel-ink);text-decoration:none}
.contact .ct-txt{display:flex;flex-direction:column;font-size:12px;line-height:1.35;min-width:0}
.contact .ct-txt b{font-size:13px}
.contact .ct-txt span{color:var(--panel-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.contact .cta-ico{height:38px;border-radius:var(--r-sm)}
.contact:hover .cta-ico{background:#EC5F14;color:#431604}
.contact:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
/* couleurs : fond (carrés, un seul) et pastilles (ronds, plusieurs) */
.colcard{background:var(--row);border-radius:var(--r-md);padding:10px 10px 12px}
.colcard h3{margin:0;font-size:12.5px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.colcard h3 small{font-weight:400;color:var(--panel-soft);font-size:11.5px}
.swg{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:9px}
.sw2{position:relative;aspect-ratio:1;border:0;padding:0;cursor:pointer;background:var(--c);box-shadow:inset 0 0 0 1px rgba(67,22,4,.14)}
.sw2.sq{border-radius:var(--r-sm)} .sw2.ci{border-radius:50%}
.sw2[aria-pressed="true"]{box-shadow:0 0 0 2px var(--panel-bg),0 0 0 3.5px var(--panel-ink)}
.sw2[aria-pressed="true"]::after{content:"✓";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--tick,#fff)}
.sw2:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
.colprev{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:11.5px;color:var(--panel-soft)}
.colprev i{width:42px;height:22px;border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;gap:3px;box-shadow:inset 0 0 0 1px rgba(67,22,4,.14)}
.colprev i b{width:9px;height:5px;border-radius:3px}
@media (max-width:720px){
  .topbar{height:auto;flex-wrap:wrap;padding:8px 10px;gap:8px}
  .tb-right .tbtn:not(.icon){display:none}
  .panel{top:auto;left:8px;right:8px;width:auto;height:min(52vh,520px);bottom:calc(140px + env(safe-area-inset-bottom,0px))}
  .dock{left:50%;max-width:calc(100vw - 16px);bottom:calc(76px + env(safe-area-inset-bottom,0px))}
  .contact{left:8px;right:8px;width:auto;height:52px;bottom:calc(8px + env(safe-area-inset-bottom,0px))}
}

/* ===================== Mode libre ===================== */
.libre{position:fixed;inset:0;z-index:3;background:
  radial-gradient(1200px 600px at 70% 10%, rgba(236,95,20,.10), transparent 60%),
  radial-gradient(900px 600px at 10% 90%, rgba(145,187,123,.12), transparent 60%),
  #E9E0D9}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .libre{background:radial-gradient(1200px 600px at 70% 10%, rgba(236,95,20,.12), transparent 60%),#1d0a03} }
.libre[hidden]{display:none}
.libre::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(67,22,4,.13) 1px, transparent 1px);background-size:22px 22px;pointer-events:none}
body.libre-on #panel, body.libre-on #btnPlay, body.libre-on #btnNew, body.libre-on #btnHide, body.libre-on #openPanel, body.libre-on .topbar .advsw, body.libre-on #resetBtn, body.libre-on #btnCapture, body.libre-on #labels{display:none!important}
body.libre-on .dock{left:calc(304px + (100vw - 304px)/2);max-width:calc(100vw - 330px)}
.lb-side{position:absolute;top:calc(76px + env(safe-area-inset-top,0px));left:12px;bottom:calc(84px + env(safe-area-inset-bottom,0px));width:280px;border-radius:var(--r-lg);overflow-y:auto;padding:4px 12px 16px;color:var(--panel-ink);font-size:13px}
.lb-side h2{font-size:11.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--panel-ink);opacity:.6;margin:14px 4px 8px}
.lb-col{display:flex;flex-direction:column;gap:6px}
.lb-btn{font:inherit;font-size:12.5px;font-weight:600;color:var(--panel-ink);background:var(--row);border:0;border-radius:var(--r-md);padding:9px 10px;cursor:pointer;text-align:left;display:flex;align-items:center;gap:8px}
.lb-btn:hover{background:var(--row-hov)} .lb-btn[aria-pressed="true"]{background:var(--seg-on);box-shadow:inset 0 0 0 1.5px var(--panel-ink)}
.lb-btn:focus-visible,.lb-ic:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.lb-row{display:flex;gap:6px;align-items:center}
.lb-row>*{flex:1}
.lb-in{font:inherit;font-size:12.5px;color:var(--panel-ink);background:var(--row);border:0;border-radius:var(--r-md);height:36px;padding:0 10px;width:100%;min-width:0}
.lb-in:focus-visible{outline:2px solid var(--focus)}
select.lb-in{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 15px) 16px,calc(100% - 10px) 16px;background-size:5px 5px;background-repeat:no-repeat;padding-right:28px}
.lb-layer{display:flex;align-items:center;gap:8px;background:var(--row);border-radius:var(--r-md);padding:5px 6px}
.lb-layer[aria-selected="true"]{box-shadow:inset 0 0 0 1.5px var(--orange);background:var(--seg-on)}
.lb-layer img{width:34px;height:34px;object-fit:contain;background:repeating-conic-gradient(#ddd 0 25%,#fff 0 50%) 0 0/10px 10px;border-radius:var(--r-sm);flex:none}
.lb-layer .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px;cursor:pointer;background:none;border:0;color:inherit;text-align:left;font:inherit}
.lb-ic{border:0;background:transparent;color:var(--panel-ink);width:24px;height:24px;border-radius:var(--r-sm);cursor:pointer;font-size:13px;line-height:1;flex:none}
.lb-ic:hover{background:var(--row-hov)}
.lb-empty{font-size:12px;color:var(--panel-soft);line-height:1.45;margin:2px 4px}
.lb-stage{position:absolute;top:calc(76px + env(safe-area-inset-top,0px));left:304px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;justify-content:center;overflow:hidden}
.artboard{position:relative;flex:none;transform-origin:center center;box-shadow:0 24px 60px rgba(67,22,4,.22),0 0 0 1px rgba(67,22,4,.08);overflow:hidden}
.artboard.transp{background-image:repeating-conic-gradient(#e6e0db 0 25%,#fff 0 50%)!important;background-size:24px 24px!important}
.ab-layer{position:absolute;left:0;top:0;transform-origin:center center;cursor:move;user-select:none;-webkit-user-drag:none}
.ab-sel{position:absolute;left:0;top:0;pointer-events:none;border:1.5px solid #EC5F14;transform-origin:center center}
.ab-sel .h{position:absolute;width:14px;height:14px;background:#fff;border:1.5px solid #EC5F14;border-radius:3px;pointer-events:auto}
.ab-sel .h.sc{right:-8px;bottom:-8px;cursor:nwse-resize}
.ab-sel .h.ro{left:50%;top:-34px;margin-left:-7px;border-radius:50%;cursor:grab}
.ab-sel .stem{position:absolute;left:50%;top:-20px;width:1.5px;height:20px;background:#EC5F14;margin-left:-.75px}
.ab-guide{position:absolute;background:#EC5F14;opacity:.7;pointer-events:none}
.ab-size{position:absolute;left:0;top:-26px;font-size:12px;color:var(--panel-soft);white-space:nowrap;transform-origin:left bottom}

/* dock compact sur une seule ligne */
.dock{flex-wrap:nowrap;gap:6px;padding:7px}
.dock .seg button{padding:6px 9px;font-size:12px}
.dock .advsw{padding:0 9px;font-size:12px}
.dock .dk-sep{display:none}
@media (max-width:1500px){ .dock .dk-lbl{display:none} }
body.libre-on .dock{left:calc(304px + (100vw - 304px - 340px)/2);max-width:calc(100vw - 304px - 352px)}
@media (max-width:1180px){ .dock{flex-wrap:wrap} .dock .dk-note{display:none} }
.toast{bottom:calc(86px + env(safe-area-inset-bottom,0px))!important;z-index:20}

/* ===================== Interface v4 (maquette Co-labs) ===================== */
:root{
  --chrome:#ECE7E3; --ink:#3A1B0E; --muted:#A99B91; --ctl:#E1D9D3; --ctl2:#D4C9C1; --ctl-fill:#CFC3BA; --line:#DCD3CC; --orange:#EC5F14; --brown:#431604;
  --rail-w:76px; --panel-w:276px; --gut:56px; --st:52px; --sb:12px;
  --sl:var(--rail-w); --sr:calc(var(--panel-w) + 20px);
  --panel-ink:var(--ink); --panel-soft:#8C7D72; --panel-line:var(--line); --row:var(--ctl); --row-fill:var(--ctl-fill); --row-hov:#D9CFC8; --seg-on:var(--ctl-fill); --handle:var(--ink); --panel-bg:var(--chrome);
  --r-lg:12px; --r-md:4px; --r-sm:3px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --chrome:#1F0D05; --ink:#F1E6DE; --muted:#8E7C70; --ctl:#2E1609; --ctl2:#3A1D0E; --ctl-fill:#4A2716; --line:#352013;
  --panel-soft:#B5A397; --row-hov:#3D2112; --panel-bg:#1F0D05; } }
html,body{background:var(--chrome)!important}
body{font-family:Geist,"Helvetica Neue",Helvetica,Arial,sans-serif;color:var(--ink);font-size:14px}
body.rail-off{--sl:12px}
body.panel-off,body.libre-on{--sr:var(--gut)}
.topbar,.contact,.hint,.mark{display:none!important}
.ic{width:20px;height:20px;display:block;flex:none}
/* scène */
#scene{position:fixed;inset:auto;left:var(--sl);top:var(--st);width:calc(100vw - var(--sl) - var(--sr));height:calc(100dvh - var(--st) - var(--sb));border-radius:var(--r-lg);transition:left .25s ease,width .25s ease}
#labels{border-radius:var(--r-lg)}
/* menu de gauche */
.rail{position:fixed;z-index:7;left:0;top:0;bottom:0;width:var(--rail-w);display:flex;flex-direction:column;align-items:center;padding:12px 0 12px;gap:4px;transition:transform .25s ease}
body.rail-off .rail{transform:translateX(-100%)}
.rail-logo{width:40px;height:40px;border-radius:6px;background:var(--orange);display:flex;align-items:center;justify-content:center;color:var(--brown);flex:none}
.mark-svg{width:26px;height:auto}
.rail-div{width:24px;height:1px;background:var(--line);margin:12px 0 10px}
.rail-item{display:flex;flex-direction:column;align-items:center;gap:5px;padding:6px 2px;width:66px;border:0;background:none;color:var(--ink);font:inherit;font-size:11px;text-decoration:none;cursor:pointer;border-radius:8px}
.rail-item .ri-ic{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:background .15s}
.rail-item:hover .ri-ic{background:var(--ctl)}
.rail-item.on .ri-ic{background:var(--orange);color:var(--brown)}
.rail-item:focus-visible{outline:2px solid var(--orange);outline-offset:1px}
.rail-bottom{margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:12px}
.rail-btn,.rail-open,.corner-btn,.ph-btn{border:0;background:none;color:var(--ink);width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.rail-btn:hover,.rail-open:hover,.corner-btn:hover,.ph-btn:hover{background:var(--ctl)}
.rail-btn:focus-visible,.rail-open:focus-visible,.corner-btn:focus-visible,.ph-btn:focus-visible{outline:2px solid var(--orange)}
.rail-btn .ic{opacity:.55}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--ctl2);display:flex;align-items:center;justify-content:center;color:var(--ink)}
.rail-open{position:fixed;z-index:7;left:8px;top:8px;display:none}
body.rail-off .rail-open{display:flex}
/* onglets */
.tabs2{position:fixed;z-index:6;top:8px;left:calc(var(--sl) + (100vw - var(--sl) - var(--sr))/2);transform:translateX(-50%);display:flex;gap:6px;transition:left .25s ease}
.tabs2 button{display:flex;align-items:center;gap:7px;height:36px;padding:0 14px;border:0;border-radius:var(--r-md);background:none;color:var(--ink);font:inherit;font-size:14px;cursor:pointer}
.tabs2 button .ic{width:18px;height:18px}
.tabs2 button:hover{background:var(--ctl)}
.tabs2 button[aria-pressed="true"]{background:var(--ctl2);color:var(--orange)}
.tabs2 button:focus-visible{outline:2px solid var(--orange);outline-offset:1px}
/* commandes de scène */
.cvtools{position:fixed;z-index:5;left:calc(var(--sl) + 12px);top:calc(var(--st) + 12px);display:flex;gap:6px;transition:left .25s ease}
.cvb{width:34px;height:34px;border-radius:var(--r-md);border:0;background:rgba(236,231,227,.14);color:#F1E6DE;display:flex;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.cvb svg{width:16px;height:16px;fill:currentColor}
.cvb .ic{width:18px;height:18px;fill:none}
.cvb:hover{background:rgba(236,231,227,.26)}
.cvb:focus-visible{outline:2px solid var(--orange)}
body.light-stage .cvb{background:rgba(58,27,14,.08);color:var(--ink)}
body.light-stage .cvb:hover{background:rgba(58,27,14,.16)}
/* préréglage sur la scène */
.presetPill{position:fixed;z-index:5;left:calc(var(--sl) + (100vw - var(--sl) - var(--sr))/2);bottom:calc(var(--sb) + 14px);transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:#F4F0ED;border-radius:var(--r-md);padding:5px 5px 5px 14px;box-shadow:0 6px 20px rgba(0,0,0,.12);transition:left .25s ease}

.ps-sel{position:relative;display:flex;align-items:center}
.ps-sel select{appearance:none;-webkit-appearance:none;font:inherit;font-size:14px;color:var(--ink);background:#CBBDB2;border:0;border-radius:var(--r-sm);height:30px;padding:0 34px 0 12px;min-width:180px;cursor:pointer}
.ps-sel .ic{position:absolute;right:9px;width:14px;height:14px;pointer-events:none}
.ps-sel select:focus-visible{outline:2px solid var(--orange)}
/* éditeur (panneau de droite) */
.panel{position:fixed;top:0;right:0;bottom:0;width:calc(var(--panel-w) + 20px);padding:0 12px 12px 8px;background:var(--chrome)!important;border:0!important;border-radius:0;box-shadow:none!important;backdrop-filter:none!important;display:flex;flex-direction:column;transition:transform .25s ease}
.panel.hidden{transform:translateX(100%);opacity:1}
.ph{height:var(--st);display:flex;align-items:center;gap:6px;color:var(--muted);font-size:14px;border-bottom:1px solid var(--line);flex:none}
.ph-btn{color:var(--muted)}
.panel-scroll{padding:0 2px 12px 0;flex:1;min-height:0}
.pfoot{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0;border-top:1px solid var(--line);flex:none}
.pfoot .advsw{margin:0;background:none;padding:0;height:auto;font-size:12.5px;color:var(--ink);gap:8px}
.linkbtn{border:0;background:none;color:var(--panel-soft);font:inherit;font-size:12.5px;cursor:pointer;padding:4px 2px;border-radius:3px}
.linkbtn:hover{color:var(--ink)} .linkbtn.warn{color:var(--orange);font-weight:600}
.linkbtn:focus-visible{outline:2px solid var(--orange)}
.exportbtn{display:flex;align-items:center;justify-content:space-between;height:38px;border:0;border-radius:var(--r-md);background:var(--orange);color:var(--ink);font:inherit;font-size:14px;padding:0 12px 0 14px;cursor:pointer;flex:none}
.exportbtn .ic{width:16px;height:16px;transform:rotate(180deg);transition:transform .2s}
.exportbtn[aria-expanded="true"] .ic{transform:none}
.exportbtn:hover{filter:brightness(1.05)} .exportbtn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.corner-btn{position:fixed;z-index:6;right:10px;top:8px;display:none}
body.panel-off .corner-btn{display:flex}
.exportFab{position:fixed;z-index:6;right:10px;bottom:var(--sb);width:36px;height:36px;border:0;border-radius:var(--r-md);background:var(--orange);color:var(--ink);display:none;align-items:center;justify-content:center;cursor:pointer}
body.panel-off .exportFab,body.libre-on .exportFab{display:flex}
.exportFab:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
/* sections de l'éditeur */
details.group{border-bottom:1px solid var(--line)}
details.group>summary{padding:15px 2px 13px}
details.group>summary h2{font-size:14px;font-weight:400;letter-spacing:0;text-transform:none;color:var(--ink);opacity:1}
details.group>summary::after{transform:rotate(-135deg) translate(-2px,-2px);opacity:.9;width:7px;height:7px;border-width:1.4px}
details[open].group>summary::after{transform:rotate(45deg) translate(-2px,-2px)}
.gbody{gap:8px;padding-bottom:16px}
.fs{height:38px;border-radius:var(--r-md);background:var(--ctl);padding:0 12px}
.fs-fill{background:var(--ctl-fill)}
.fs-fill::after{width:2px;height:17px;margin-top:-8.5px;right:8px;background:var(--ink);opacity:.7}
.fs-l{color:var(--panel-soft)}
.fs-v{color:var(--ink);font-weight:400}
.fs:hover .fs-fill{background:#C9BCB2}
.seg{background:var(--ctl);border-radius:var(--r-md);padding:3px;gap:0}
.seg button{border-radius:var(--r-sm);color:var(--ink);font-size:14px;padding:8px 4px}
.seg button[aria-pressed="true"]{background:var(--ctl-fill);color:var(--ink);box-shadow:none;font-weight:400}
.toggle{height:38px;border-radius:var(--r-md);background:var(--ctl)}
.toggle>span:first-child{color:var(--ink)}
.addrow{background:var(--ctl);border-radius:var(--r-md);font-weight:400;color:var(--ink)}
.addrow:hover{background:var(--ctl2)}
details.subg{border:1px solid var(--line);border-radius:var(--r-md);padding:0 10px}
details.subg>summary{font-weight:400;font-size:13.5px}
.sub{font-size:12px;color:var(--panel-soft);margin:6px 2px 0}
body:not(.expert) #controls .note{display:none}
.psave{gap:6px}
.psave input{height:38px;border-radius:var(--r-md);background:var(--ctl);font-size:14px;padding:0 12px}
.psave input::placeholder{color:var(--muted)}
.psave .xbtn{width:38px;height:38px;flex:none;padding:0;border-radius:var(--r-md);background:var(--brown);color:#fff;font-size:0;display:flex;align-items:center;justify-content:center}
.psave .xbtn::before{content:"+";font-size:20px;line-height:1;font-weight:300}
.plist{gap:6px;margin-top:6px}
.pitem{background:var(--ctl);border-radius:var(--r-md)}
.pitem .pname{font-size:14px;padding:9px 12px}
.pitem .pname small{display:none}
body:not(.expert) .pitem .pic:not(:last-child){display:none}
.pitem .pic{color:var(--ink)}
.colcard{background:var(--ctl);border-radius:var(--r-md)}
.chip,.drow,.pitem,.lb-in,.lb-btn,.lb-layer{border-radius:var(--r-md)}
/* export (fenêtre au-dessus du bouton) */
.dock{position:fixed!important;z-index:8;left:auto!important;transform:none!important;right:12px;bottom:calc(var(--sb) + 46px);width:var(--panel-w);max-width:calc(100vw - 24px)!important;flex-direction:column!important;align-items:stretch!important;flex-wrap:nowrap!important;gap:8px!important;padding:12px!important;border-radius:var(--r-md)!important;background:#F4F0ED!important;border:1px solid var(--line)!important;box-shadow:0 16px 40px rgba(58,27,14,.18)!important;color:var(--ink)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .dock{background:#2A1308!important} }
.dock[hidden]{display:none!important}
.dock .dk-lbl{display:block!important;font-size:12px;letter-spacing:0;text-transform:none;color:var(--panel-soft);padding:0 2px}
.dock .dk-opts{flex-direction:column;align-items:stretch}
.dock .seg{display:flex}
.dock .seg button{flex:1;padding:7px 4px;font-size:13px}
.dock .advsw,.dock .dk-num{background:var(--ctl);border-radius:var(--r-md);justify-content:space-between}
.dock .dk-note{display:block!important;max-width:none}
.dock .cta{height:38px;width:100%;border-radius:var(--r-md)}
.dock .cta .cta-l{flex:1;justify-content:center}
.dock .cta.sec{width:100%}
/* toasts au-dessus du préréglage */
.toast{left:calc(var(--sl) + (100vw - var(--sl) - var(--sr))/2)!important;bottom:calc(var(--sb) + 68px)!important}
/* mode libre : dans la scène */
.libre{inset:auto!important;left:var(--sl)!important;top:var(--st)!important;width:calc(100vw - var(--sl) - var(--sr));height:calc(100dvh - var(--st) - var(--sb));border-radius:var(--r-lg);overflow:hidden;background:#E3DBD5!important}
.lb-side{top:12px!important;left:12px!important;bottom:12px!important;background:var(--chrome)!important;border:1px solid var(--line)!important;box-shadow:none!important;backdrop-filter:none!important}
.lb-stage{top:12px!important;left:304px!important;right:12px!important;bottom:12px!important}
body.libre-on .cvtools,body.libre-on .presetPill{display:none!important}
@media (max-width:720px){
  :root{--rail-w:0px;--st:52px}
  .rail{transform:translateX(-100%);background:var(--chrome);width:76px;box-shadow:8px 0 30px rgba(0,0,0,.12)}
  body.rail-show .rail{transform:none}
  .rail-open{display:flex!important}
  body.rail-show .rail-open{display:none!important}
  :root{--sl:8px;--sr:8px} body.panel-off,body.libre-on{--sr:8px}
  .tabs2{left:50%} .tabs2 button span{display:none}
  .panel{left:8px;right:8px;top:auto;width:auto;height:min(55dvh,520px);bottom:8px;border-radius:12px;padding:0 10px 10px;box-shadow:0 -10px 40px rgba(0,0,0,.18)!important}
  .panel.hidden{transform:translateY(110%)}
  .presetPill{bottom:calc(var(--sb) + 56px)}
  .exportFab{display:flex}
}

/* ===================== Interface v5 : proportions de la maquette (2380 px = 1) ===================== */
:root{ --u:clamp(0.72px, calc(100vw / 2380), 1px);
  --rail-w:calc(94 * var(--u)); --panel-w:calc(318 * var(--u)); --st:calc(66 * var(--u)); --sb:calc(13 * var(--u)); --gut:calc(94 * var(--u));
  --sr:calc(var(--panel-w) + 46 * var(--u)); --fs:calc(18 * var(--u)); --row-h:calc(46 * var(--u)); --gap:calc(10 * var(--u)); }
body.panel-off,body.libre-on{--sr:var(--gut)}
#scene{border-radius:calc(20 * var(--u))}
/* menu de gauche */
.rail{padding:calc(23 * var(--u)) 0}
.rail-logo{width:calc(48 * var(--u));height:calc(48 * var(--u));border-radius:calc(6 * var(--u))}
.mark-svg{width:calc(30 * var(--u))}

.rail-item .ri-ic{width:calc(48 * var(--u));height:calc(48 * var(--u))}
.rail-item .ic,.rail-btn .ic,.avatar .ic{width:calc(24 * var(--u));height:calc(24 * var(--u))}
.rail-btn{width:calc(48 * var(--u));height:calc(48 * var(--u))}
.avatar{width:calc(48 * var(--u));height:calc(48 * var(--u))}
.rail-bottom{gap:calc(14 * var(--u))}
/* onglets */
.tabs2{top:calc(12 * var(--u));gap:calc(14 * var(--u))}
.tabs2 button{height:calc(42 * var(--u));padding:0 calc(22 * var(--u));font-size:var(--fs);gap:calc(9 * var(--u));border-radius:calc(4 * var(--u))}
.tabs2 button .ic{width:calc(20 * var(--u));height:calc(20 * var(--u))}
/* éditeur */
.panel{width:calc(var(--panel-w) + 46 * var(--u));padding:0 calc(23 * var(--u)) calc(23 * var(--u)) calc(23 * var(--u))}
.ph{height:calc(76 * var(--u));font-size:var(--fs);gap:calc(10 * var(--u))}
.ph .ic{width:calc(22 * var(--u));height:calc(22 * var(--u))}
.ph-btn{width:calc(30 * var(--u));height:calc(30 * var(--u));margin-left:calc(-4 * var(--u))}
.ph-adv{margin-left:auto!important;background:none!important;padding:0!important;height:auto!important;font-size:calc(15 * var(--u))!important;color:var(--panel-soft)!important;gap:calc(8 * var(--u))!important}
#panel .panel-scroll{padding:0}
#panel details.group>summary{padding:calc(24 * var(--u)) 0 calc(22 * var(--u))}

#panel .fs,#panel .toggle,#panel .seg,#panel .addrow,#panel .psave input,#panel .pitem,#panel .crow{min-height:var(--row-h);height:var(--row-h);font-size:var(--fs);border-radius:calc(4 * var(--u))}
#panel .fs{padding:0 calc(20 * var(--u))}

#panel .fs-l{max-width:62%}
#panel .seg{padding:calc(4 * var(--u))}

#panel .toggle>span:first-child{color:var(--panel-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}

#panel .selname{display:none}
details.subg>summary{font-size:var(--fs)!important}
.pfoot{padding:calc(14 * var(--u)) 0}

#panel .toggle input:checked+.track::after,.ph-adv input:checked+.track::after{background:#F4F0ED;transform:translateX(calc(18 * var(--u)))}
/* Images : liste avec poignée */
.imlist{display:flex;flex-direction:column;gap:var(--gap)}
.imrow{display:flex;align-items:center;height:calc(40 * var(--u));border-radius:calc(4 * var(--u));background:var(--ctl);padding:0 calc(10 * var(--u)) 0 calc(12 * var(--u));gap:calc(10 * var(--u));color:var(--muted)}

.imdel.armed{background:var(--orange);color:#fff}
.imname:focus-visible,.imdel:focus-visible{outline:2px solid var(--orange)}
/* bande d'images en bas de la scène */
.imgStrip{position:fixed;z-index:5;display:none;left:calc(var(--sl) + (100vw - var(--sl) - var(--sr))/2);bottom:calc(var(--sb) + 26 * var(--u));transform:translateX(-50%);max-width:calc(100vw - var(--sl) - var(--sr) - 40px);overflow-x:auto;gap:calc(8 * var(--u));padding:calc(8 * var(--u));background:#E6DFD9;border-radius:calc(6 * var(--u));align-items:center;scrollbar-width:none}
.imgStrip::-webkit-scrollbar{display:none}

.stile{position:relative;flex:none;width:calc(73 * var(--u));height:calc(73 * var(--u));border-radius:calc(4 * var(--u));background:#DDD4CE}

.dl-vp{position:absolute;inset:0;overflow:hidden;background-image:radial-gradient(rgba(58,27,14,.42) 1.1px, transparent 1.3px);touch-action:none;cursor:default}

<script>
(function(){
"use strict";

/* ------------------------------------------------------------------ */
/*  Palette et associations (planche couleur)                          */
/* ------------------------------------------------------------------ */
const PALETTE = [
  {id:'brun',   name:'Brun',   hex:'#431604'},
  {id:'orange', name:'Orange', hex:'#EC5F14'},
  {id:'taupe',  name:'Taupe',  hex:'#C2B1A2'},
  {id:'grege',  name:'Grège',  hex:'#C0B0A1'},
  {id:'lin',    name:'Lin',    hex:'#F1E2DA'},
  {id:'sauge',  name:'Sauge',  hex:'#91BB7B'},
  {id:'ciel',   name:'Ciel',   hex:'#90D7EB'},
];
const HEX = {}; const PAL = {};
PALETTE.forEach(p=>{ HEX[p.id]=p.hex; const c=new THREE.Color(p.hex); PAL[p.id]=[c.r,c.g,c.b]; });
const NAME = id => (PALETTE.find(p=>p.id===id)||PALETTE[0]).name;
// toutes les couleurs de la charte se combinent librement
const PAIRS = [];
const ALLOWED = {};
PALETTE.forEach(p=>ALLOWED[p.id]=new Set(PALETTE.map(q=>q.id)));
const DARK_BG = new Set(['brun']);

/* ------------------------------------------------------------------ */
/*  Réglages                                                           */
/* ------------------------------------------------------------------ */
// Deux variantes : 0 = aérée (un seul fil directeur bouclé, ponctué de synapses), 1 = dense (réseau tramé)
const VARIANTS = [
  {neurons:10, maxLinks:16, synapses:5, births:0.8, life:18, grow:1.0, density:2.0, strands:4, bundle:1.0, dotSize:1.1, linePx:1.0, fusion:0.35, nodes:false, lines:true, colorMode:2, relief:0, flow:1.0, maxPx:80, fov:38, depthThin:0},
  {neurons:48, maxLinks:60, synapses:6, births:2.2, life:24, grow:1.0, density:2.6, strands:6, bundle:1.0, dotSize:1.0, linePx:1.0, fusion:0.6, nodes:true, lines:false, colorMode:1, relief:0, flow:1.0, maxPx:80, fov:38, depthThin:0},
  {grow:1.5, dotSize:0.6, fusion:0, colorMode:2, relief:0.7, flow:1.2, nodes:false, lines:false, qCount:30000, tubeR:1.7, fill:0.15, swirl:0.35, twinkle:0.45, jitter:0.25, maxPx:9},
];
const S = Object.assign({
  variant:0, paused:false, autoRotate:true, rotSpeed:1.0, sway:0.3, flow:1.0,
  aspect:2.0, contrast:0.7, nodeSize:1.0,
  qCount:30000, tubeR:1.7, fill:0.15, swirl:0.35, twinkle:0.45, jitter:0.25, relief:0, maxPx:80,
  pinches:0, pinchDepth:0.8, pinchWidth:0.035, pinchSpeed:1.0, bulge:0,
  qStruct:0, thin:0.06, junction:1.0, lobes:5, lobeLen:4.5, neckDensity:0.55, fov:38, depthThin:0,
  lineMode:0, lineData:'12, 80', lineUnit:'%', lineLabels:true, lineWave:0.3,
  lineTexts:'Lorem Ipsum\nLorem Ipsum', infoScale:1, infoGap:1, lineLen:56, figmaMode:0, lobeContrast:0.5, linePath:null, linePathLen:0, lineFade:0.6, dataContrast:1, procSteps:4, procLabel:'Étape', procMin:0.12, procCurve:1.3,
  procTexts:'Lorem ipsum dolor sit amet, consectetur adipiscing elit.\nSed do eiusmod tempor incididunt ut labore et dolore magna aliqua.\nUt enim ad minim veniam, quis nostrud exercitation ullamco.\nDuis aute irure dolor in reprehenderit in voluptate velit esse.',
  shapeMode:0, bg:'brun', dots:new Set(['orange','sauge','lin']), lineColor:'brun', fog:0
}, VARIANTS[0]);
S.hoverOn=true; S.hoverMode=0; S.hoverRadius=150; S.hoverForce=1; S.hoverIn=0.35; S.hoverOut=1.2;
S.loopPath=null; S.loopNormal=null;
S.expTab=0; S.expSize=1; S.expFmt=0; S.expBg=false;
S.app='motif'; S.imgCols=194; S.imgLoop=false; S.videoBuild=false; S.imgInvert=false; S.imgRelief=0.8; S.imgHold=2.5; S.imgTrans=2.4; S.imgScatter=1; S.imgSmooth=0.5; S.videoDur=8;
S.imgBright=0; S.imgContr=10; S.imgGamma=1; S.imgLow=8; S.imgHigh=94; S.imgBlur=1; S.imgAngle=45; S.imgMin=0; S.imgMax=118;
S.noiseAmp=1.5; S.noiseSpeed=1; S.noiseDis=60; S.noiseSize=6;
// Réglage de base de la Membrane (aussi appliqué quand on choisit « Membrane »)
const MEMBRANE_BASE={fill:0, fusion:0.43, tubeR:1.6, qCount:97000, swirl:0.26, twinkle:0.81, jitter:0, pinches:0, bulge:0,
  relief:4, fov:77, depthThin:1, neckDensity:0.2, autoRotate:true,
  lobes:3, lobeLen:7.9, junction:1.69, thin:0.23,
  dotSize:1.5, aspect:2, contrast:0.71, maxPx:2};
// À l'ouverture : Quantique › Membrane › Nœud
Object.assign(S, VARIANTS[2], {variant:2, qStruct:1, shapeMode:0}, MEMBRANE_BASE);

/* ------------------------------------------------------------------ */
/*  Hasard                                                             */
/* ------------------------------------------------------------------ */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
let rng = mulberry32((Math.random()*1e9)|0);
function hash3(a,b,c){
  let h = Math.imul(a|0,0x27d4eb2d) ^ Math.imul(b|0,0x165667b1) ^ Math.imul(c|0,0x9e3779b1);
  h = Math.imul(h ^ (h>>>15), 0x85ebca6b); h = Math.imul(h ^ (h>>>13), 0xc2b2ae35); h ^= h>>>16;
  return (h>>>0)/4294967296;
}
function randUnit(r){ const u=r()*2-1, th=r()*Math.PI*2, s=Math.sqrt(1-u*u); return new THREE.Vector3(s*Math.cos(th),u,s*Math.sin(th)); }
function gauss(r){return Math.sqrt(-2*Math.log(r()+1e-9))*Math.cos(2*Math.PI*r());}

/* ------------------------------------------------------------------ */
/*  Rendu                                                              */
/*  1. les pastilles (gélules) sont dessinées dans une texture avec un */
/*     halo doux ; 2. un seuil net les redessine à l'écran : là où     */
/*     deux halos se touchent, les pastilles fusionnent comme sur la   */
/*     trame imprimée.                                                 */
/* ------------------------------------------------------------------ */
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
renderer.autoClear = false;
const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 600);
const pillScene = new THREE.Scene(), lineScene = new THREE.Scene(), quadScene = new THREE.Scene();
const quadCam = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const rt = new THREE.WebGLRenderTarget(4,4,{depthBuffer:false, stencilBuffer:false, minFilter:THREE.LinearFilter, magFilter:THREE.LinearFilter});

const pillMat = new THREE.ShaderMaterial({
  uniforms:{ uScale:{value:1}, uFogNear:{value:30}, uFogFar:{value:80}, uFog:{value:S.fog},
             uAspect:{value:S.aspect}, uFusion:{value:S.fusion}, uBg:{value:new THREE.Color()}, uLinePx:{value:1}, uPR:{value:1}, uRefZ:{value:50}, uRelief:{value:0}, uMaxPx:{value:80}, uThin:{value:0} },
  vertexShader:`
    attribute float aSize; attribute float aSeed; attribute vec3 aColor;
    uniform float uScale; uniform float uFogNear; uniform float uFogFar; uniform float uFog;
    uniform float uAspect; uniform float uFusion; uniform vec3 uBg; uniform float uLinePx; uniform float uPR; uniform float uRefZ; uniform float uRelief; uniform float uMaxPx; uniform float uThin;
    varying vec3 vC; varying float vW; varying float vAr; varying float vHalo; varying float vPS;
    void main(){
      vec4 mv = modelViewMatrix*vec4(position,1.0);
      gl_Position = projectionMatrix*mv;

let nodes = [], links = [], linkKeys = new Set(), linkId = 1, spawnAcc = 0, worldR = 14;
const NODE_K = 42;

function buildNodes(){
  nodes = []; links = []; linkKeys.clear(); spawnAcc = 0;
  const n = S.neurons;
  worldR = S.variant===0 ? 13 : 10 + Math.sqrt(n)*0.9;
  const nc = 3 + Math.floor(rng()*4), centers = [];
  for (let i=0;i<nc;i++){
    const v = randUnit(rng).multiplyScalar(worldR*(0.25+rng()*0.6)); v.x*=1.35; v.y*=0.75;
    centers.push({p:v, s:worldR*(0.18+rng()*0.22)});
  }
  for (let i=0;i<n;i++){
    let p;
    if (S.variant===1 && rng()<0.78){ const c=centers[Math.floor(rng()*nc)]; p=new THREE.Vector3(gauss(rng),gauss(rng),gauss(rng)).multiplyScalar(c.s).add(c.p); }
    else { p=randUnit(rng).multiplyScalar(worldR*Math.cbrt(rng())); p.x*=1.35; p.y*=0.75; }
    // amas de pastilles : une petite sphère tramée
    const off = new Float32Array(NODE_K*3), wt = new Float32Array(NODE_K);
    for (let k=0;k<NODE_K;k++){
      const v = randUnit(rng).multiplyScalar(Math.cbrt(rng()));
      off[k*3]=v.x*1.25; off[k*3+1]=v.y*0.9; off[k*3+2]=v.z;
      wt[k] = 1 - 0.55*v.length() + (rng()-0.5)*0.25;
    }
    nodes.push({p, deg:0, pulse:0, r1:rng(), size:0.8+rng()*0.5, off, wt, id:i+1});
  }
  const cen = new THREE.Vector3(); nodes.forEach(N=>cen.add(N.p)); cen.divideScalar(nodes.length||1); nodes.forEach(N=>N.p.sub(cen));
  for (const a of nodes) a.nb = nodes.filter(b=>b!==a).map(b=>({b,d:a.p.distanceTo(b.p)})).sort((x,y)=>x.d-y.d).slice(0,8).map(o=>o.b);
}

function bezier(p0,p1,p2,p3,t,out){
  const u=1-t, a=u*u*u, b=3*u*u*t, c=3*u*t*t, d=t*t*t;
  return out.set(a*p0.x+b*p1.x+c*p2.x+d*p3.x, a*p0.y+b*p1.y+c*p2.y+d*p3.y, a*p0.z+b*p1.z+c*p2.z+d*p3.z);

function buildCurve(A,B,P1,P2){
  const d = A.distanceTo(B);

  const ext = ()=> airy ? d*(0.5+rng()*0.9)+worldR*(0.2+rng()*0.5) : d*(0.35+rng()*0.9);
  const p1 = P1 || A.clone().add(randUnit(rng).multiplyScalar(ext()));
  const p2 = P2 || B.clone().add(randUnit(rng).multiplyScalar(ext()));

    while (k<RAW-1 && cum[k+1]<target) k++;

// Faisceaux : en variante dense, toute la connexion est un tube de brins.
// En variante aérée, le filament s'ouvre par endroits en quelques brins en éventail.
function makeBundles(L){
  if (S.variant===1) return [{ta:0, tb:1, tube:true, mul:L.strMul}];
  const out=[], r=rng();
  const nb = r<0.15 ? 0 : r<0.7 ? 1 : 2;
  const slots = nb===2 ? [[0.06,0.46],[0.54,0.94]] : [[0.08,0.92]];
  for (let i=0;i<nb;i++){
    const [lo,hi]=slots[i], span=Math.min(hi-lo, 0.16+rng()*0.3);
    const ta=lo+rng()*(hi-lo-span);
    out.push({ta, tb:ta+span, tube:false, mul:0.6+rng()*0.9,
      rad:L.len*span*(0.09+rng()*0.12), ang:rng()*TAU, twist:(rng()-0.5)*2.2, arc:Math.PI*(0.5+rng()*0.6)});
  }
  return out;
}
function spawnLink(){
  if (nodes.length<2) return;
  for (let attempt=0;attempt<24;attempt++){
    let a;
    if (links.length && rng()<0.55){ const L=links[Math.floor(rng()*links.length)]; a=rng()<0.5?L.A:L.B; }
    else a=nodes[Math.floor(rng()*nodes.length)];
    const near = S.variant===1 ? 0.8 : 0.3;
    const b = rng()<near ? a.nb[Math.floor(rng()*a.nb.length)] : nodes[Math.floor(rng()*nodes.length)];
    if (!b || a===b) continue;
    const key=Math.min(a.id,b.id)+'-'+Math.max(a.id,b.id);
    if (linkKeys.has(key)) continue;
    const L = Object.assign(buildCurve(a.p,b.p), {
      id:linkId++, A:a, B:b, key, state:0, progress:0, die:0, age:0,
      life:S.life*(0.6+rng()*0.8), flow:rng(),
      radius:0.3+Math.pow(rng(),1.4)*1.7, strMul:0.5+rng(), densMul:0.8+rng()*0.4,
      thick:0.65+rng()*0.7, cr:rng(), speed:0.75+rng()*0.5,
      toneF:6+rng()*18, tonePh:rng()*6.283

    L.bundles = makeBundles(L);
    links.push(L); linkKeys.add(key); a.deg++; b.deg++; a.pulse=Math.max(a.pulse,0.7);
    return;
  }
}

  let plen=0; for (let i=1;i<sp.length;i++) plen+=Math.hypot(sp[i][0]-sp[i-1][0],sp[i][1]-sp[i-1][1]);
  if (sp.length<6 || plen<60){ toast('Trace une courbe un peu plus longue.'); lineDraw.pts=[]; drawPreview(); return; }
  // lissage léger du geste
  const sm=sp.map((p,i)=>{ let x=0,y=0,c=0; for (let d=-3;d<=3;d++){ const q=sp[Math.min(sp.length-1,Math.max(0,i+d))]; x+=q[0]; y+=q[1]; c++; } return [x/c,y/c]; });

  camera.updateMatrixWorld();

    S.loopNormal=[+nrm.x.toFixed(4),+nrm.y.toFixed(4),+nrm.z.toFixed(4)];

    return;
  }
  const pts=new THREE.CatmullRomCurve3(out,false,'centripetal').getSpacedPoints(119);
  let wl=0; for (let i=1;i<pts.length;i++) wl+=pts[i].distanceTo(pts[i-1]);

const Store={kind:'local', db:null, readOnly:false,
  async init(){
    try{ if (window.claude && typeof window.claude.use==='function'){ const db=await window.claude.use('db'); if (db){ this.db=db; this.kind='claude'; return; } } }catch(e){}
    try{ const r=await fetch('/api/store?ping=1',{cache:'no-store'}); if (r.ok){ const j=await r.json(); if (j && j.ok){ this.kind='api'; return; } } }catch(e){}
    this.kind='local';
  },
  _lk(col){ return 'bhc.store.'+col; },
  _lread(col){ try{ return JSON.parse(localStorage.getItem(this._lk(col))||'{}')||{}; }catch(e){ return {}; } },
  _lwrite(col,o){ try{ localStorage.setItem(this._lk(col),JSON.stringify(o)); return true; }catch(e){ return false; } },
  async list(col){
    if (this.kind==='claude'){ const q=await this.db.collection(col).get(); return q.docs.map(d=>({id:d.id, data:d.data()})).filter(x=>x.data); }
    if (this.kind==='api'){ const r=await fetch('/api/store?col='+col,{cache:'no-store'}); const j=await r.json(); if (!j.ok) throw new Error(j.error||'api'); return j.items; }
    const o=this._lread(col); return Object.keys(o).map(id=>({id, data:o[id]}));
  },
  async get(col,id){
    if (this.kind==='claude'){ const d=await this.db.collection(col).doc(id).get(); return d.exists?d.data():null; }
    if (this.kind==='api'){ const r=await fetch('/api/store?col='+col+'&id='+encodeURIComponent(id),{cache:'no-store'}); const j=await r.json(); return j.ok && j.item ? j.item.data : null; }
    return this._lread(col)[id]||null;
  },
  async put(col,id,data){
    if (this.readOnly) throw Object.assign(new Error('lecture seule'),{code:'readonly'});
    if (this.kind==='claude'){
      try{ await this.db.collection(col).doc(id).set(data); return; }
      catch(e){ if (e && e.code==='invalid_argument'){ this.readOnly=true; } throw e; }
    }
    if (this.kind==='api'){ const r=await fetch('/api/store',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({col,id,data})}); const j=await r.json().catch(()=>({})); if (!r.ok || !j.ok) throw new Error(j.error||('HTTP '+r.status)); return; }

  },
  async del(col,id){
    if (this.kind==='claude'){ await this.db.collection(col).doc(id).delete(); return; }
    if (this.kind==='api'){ await fetch('/api/store?col='+col+'&id='+encodeURIComponent(id),{method:'DELETE'}); return; }

  }

      const rad = S.nodeSize*N.size*(0.55+0.1*Math.min(N.deg,8))*act*(1+N.pulse*0.35);
      const col = P[Math.floor(N.r1*PL)];
      const kk = N.deg>0 ? NODE_K : 10;
      for (let k=0;k<kk && n<MAXD;k++){
        const o=n*3;
        sPos[o]=N.p.x+N.off[k*3]*rad; sPos[o+1]=N.p.y+N.off[k*3+1]*rad; sPos[o+2]=N.p.z+N.off[k*3+2]*rad;
        sSize[n]=dsz*1.25*Math.max(0.15,N.wt[k])*(0.7+0.3*act)*S.nodeSize;
        sSeed[n]=hash3(N.id,k,3);
        sCol[o]=col[0]; sCol[o+1]=col[1]; sCol[o+2]=col[2];
        n++;
      }
    }
  }

  }
  if (S.hoverOn && !LM) applyHover(n, dt);
  // tri arrière → avant (tri par paquets, en O(n))
  camera.getWorldDirection(camDir);
  const cx=camera.position.x, cy=camera.position.y, cz=camera.position.z;
  const dist=camera.position.distanceTo(orbit.target);
  const zNear=Math.max(0.1,dist-worldR*2.2), zFar=dist+worldR*2.2, zr=(NB-1)/(zFar-zNear);
  counts.fill(0);
  for (let i=0;i<n;i++){
    const z=(sPos[i*3]-cx)*camDir.x+(sPos[i*3+1]-cy)*camDir.y+(sPos[i*3+2]-cz)*camDir.z;
    let k=((zFar-z)*zr)|0; k=k<0?0:k>=NB?NB-1:k;
    keys[i]=k; counts[k]++;
  }
  let acc=0; for (let b=0;b<NB;b++){ const c=counts[b]; counts[b]=acc; acc+=c; }
  for (let i=0;i<n;i++){
    const d=counts[keys[i]]++, o=i*3, p=d*3;
    dPos[p]=sPos[o]; dPos[p+1]=sPos[o+1]; dPos[p+2]=sPos[o+2];
    dCol[p]=sCol[o]; dCol[p+1]=sCol[o+1]; dCol[p+2]=sCol[o+2];
    dSize[d]=sSize[i]; dSeed[d]=sSeed[i];
  }
  dGeo.setDrawRange(0,n); lastN=n;
  for (const name of ['position','aSize','aSeed','aColor']){ const at=dGeo.attributes[name]; at.updateRange.offset=0; at.updateRange.count=n*at.itemSize; at.needsUpdate=true; }

  const lv=0;
  const fNear=Math.max(0.1,dist-worldR*0.9), fFar=dist+worldR*1.6; lastFog={near:fNear,far:fFar};
  [pillMat,lMat].forEach(m=>{ m.uniforms.uFogNear.value=fNear; m.uniforms.uFogFar.value=fFar; m.uniforms.uFog.value=S.fog; });
  quadMat.uniforms.uSnap.value = S.fog<0.005 ? 1 : 0;
  pillMat.uniforms.uAspect.value=S.aspect; pillMat.uniforms.uFusion.value=S.fusion;

  // 1. champ des pastilles
  renderer.setRenderTarget(rt);
  renderer.setClearColor(0x000000,0); renderer.clear();
  renderer.render(pillScene,camera);
  // 2. fond + filaments + seuil
  renderer.setRenderTarget(null);
  if (LM) renderer.setClearColor(0x000000,0); else renderer.setClearColor(new THREE.Color(bgCol[0],bgCol[1],bgCol[2]),1);
  renderer.clear();
  if (lv) renderer.render(lineScene,camera);
  renderer.render(quadScene,quadCam);
  if (!LM) updateLabels();
}

function engCapture(){ return {nodes,links,linkKeys,linkId,spawnAcc,worldR,loop,syn,synId,synAcc,drawP,loopShape,qTime,pinches,lobes,lobePhase,lobeN,linePh,lineLobes,linePhase,lineVals,lineValsKey,imgSets,imgN,imgTime,imgDirty,curImg,selImg,imgTr,imgClock}; }
function engRestore(o){ ({nodes,links,linkKeys,linkId,spawnAcc,worldR,loop,syn,synId,synAcc,drawP,loopShape,qTime,pinches,lobes,lobePhase,lobeN,linePh,lineLobes,linePhase,lineVals,lineValsKey,imgSets,imgN,imgTime,imgDirty,curImg,selImg,imgTr,imgClock}=o); }
function engFresh(img){ return {nodes:[],links:[],linkKeys:new Set(),linkId:1,spawnAcc:0,worldR:14,loop:null,syn:[],synId:1,synAcc:0,drawP:0,loopShape:0,qTime:0,pinches:[],lobes:[],lobePhase:Math.random(),lobeN:0,linePh:null,lineLobes:[],linePhase:0,lineVals:[],lineValsKey:'',imgSets:[],imgN:0,imgTime:0,imgDirty:true,curImg:img|0,selImg:img|0,imgTr:null,imgClock:0}; }
function orbitGet(){ return {theta:orbit.theta, phi:orbit.phi, radius:orbit.radius, tx:orbit.target.x, ty:orbit.target.y, tz:orbit.target.z}; }
function orbitSet(o){ if (!o) return; orbit.theta=o.theta; orbit.phi=o.phi; orbit.radius=o.radius; orbit.target.set(o.tx||0,o.ty||0,o.tz||0); orbit.vt=orbit.vp=0; }
function settingsGet(){ const o={}; for (const k in S){ const v=S[k]; o[k]= v instanceof Set ? [...v] : v; } return o; }
function settingsSet(o){ for (const k in o){ if (k==='_view' || !(k in S)) continue; S[k]= k==='dots' ? new Set(o[k]) : o[k]; } }
function paletteFast(){
  pool = PALETTE.map(p=>p.id).filter(id=>S.dots.has(id)).map(id=>PAL[id]); if (!pool.length) pool=[PAL.brun];
  lineCol = PAL[S.lineColor]||PAL.brun;
  const snap = pool.concat([lineCol]);
  snap.forEach((c,i)=>quadMat.uniforms.uPool.value[i].set(c[0],c[1],c[2])); quadMat.uniforms.uPoolN.value = snap.length;
  bgCol = PAL[S.bg]||PAL.taupe; [pillMat,lMat].forEach(m=>m.uniforms.uBg.value.setRGB(...bgCol));
}
function setRenderSize(pw,ph,zf,pan){
  const pr=renderer.getPixelRatio(); zf=Math.max(1,zf||1);
  renderer.setSize(pw/pr, ph/pr, false); rt.setSize(pw, ph);
  const W=pw*zf, H=ph*zf;   // image virtuelle agrandie, dont on ne garde que la partie cadrée
  VW=W/pr; VH=H/pr;
  camera.aspect=pw/ph;
  if (zf>1.0001){ const cx=pan?pan[0]:0, cy=pan?pan[1]:0; const ox=Math.min(W-pw,Math.max(0,W/2+cx*W-pw/2)), oy=Math.min(H-ph,Math.max(0,H/2+cy*H-ph/2)); camera.setViewOffset(W,H,ox,oy,pw,ph); }
  else camera.clearViewOffset();
  camera.updateProjectionMatrix();
  pillMat.uniforms.uScale.value = H/(2*Math.tan(THREE.MathUtils.degToRad(camera.fov)/2));
}
// L : {app, settings, cam, eng, imgIndex} ; live : les réglages du calque sont ceux de S (calque sélectionné)
function withLayer(L, live, fn){
  const mE=engCapture(), mS=live?null:settingsGet(), mO=orbitGet(), mFov=camera.fov, mApp=S.app, mVW=VW, mVH=VH, mQ=QMUL;
  try{
    if (!live) settingsSet(L.settings);
    S.app=L.app; S.paused=false;
    camera.fov=S.fov;
    if (L.eng) engRestore(L.eng);
    else { engRestore(engFresh(L.imgIndex)); if (L.app==='image'){ imgDirty=true; curImg=selImg=Math.min(L.imgIndex|0, Math.max(0,imgList.length-1)); } regenerate(); resetView(); if (!L.cam) L.cam=orbitGet(); }
    if (L.app==='image'){ const k=Math.min(L.imgIndex|0, Math.max(0,imgList.length-1)); if (curImg!==k && !imgTr){ curImg=selImg=k; } }
    orbitSet(L.cam); paletteFast();
    fn();
    L.eng=engCapture(); L.cam=orbitGet();
  } finally {
    S.app=mApp; if (!live) settingsSet(mS);
    engRestore(mE); orbitSet(mO); camera.fov=mFov; VW=mVW; VH=mVH; QMUL=mQ; paletteFast();
  }
}
function renderLayerTo(L, live, pw, ph, dt, ctx){
  const zf=Math.max(1,L.zoom||1), oldK=PXK; PXK=pw*zf/Math.max(1,L.w);
  try{ withLayer(L, live, ()=>{
    setRenderSize(pw, ph, zf, L.pan);
    stepRender(dt, performance.now(), true);
    ctx.clearRect(0,0,ctx.canvas.width,ctx.canvas.height);
    ctx.drawImage(renderer.domElement, 0, 0, ctx.canvas.width, ctx.canvas.height);
  }); } finally { PXK=oldK; }
}

function moveImage(from,to){
  if (from===to || from<0 || to<0) return;
  const cur=imgList[curImg], sel=imgList[selImg];
  const [m]=imgList.splice(from,1); imgList.splice(to,0,m);
  const base=Date.now(); imgList.forEach((im,i)=>{ im.t=base+i; saveImageMeta(im); });
  curImg=Math.max(0,imgList.indexOf(cur)); selImg=Math.max(0,imgList.indexOf(sel)); imgTr=null;
  imgDirty=true; renderThumbs();
}
async function deleteImage(k){
  const im=imgList[k]; if (!im) return;
  if (delArmed!==im){ delArmed=im; toast('Clique encore sur × pour supprimer « '+im.name+' » pour tout le monde.'); renderThumbs(); setTimeout(()=>{ if (delArmed===im){ delArmed=null; renderThumbs(); } },3000); return; }
  delArmed=null;
  if (im.id){ try{ await Store.del('images',im.id); await Store.del('imagesrc',im.id); }catch(e){} }
  imgList.splice(k,1);
  if (!imgList.length) imgList=demoImages();
  curImg=Math.min(curImg, imgList.length-1); selImg=Math.min(selImg, imgList.length-1); imgTr=null;
  imgDirty=true; renderThumbs(); loadTone(selImg);
}

function renderThumbs(){
  // liste du panneau
  imgListEl.innerHTML='';
  imgList.forEach((im,k)=>{
    const row=el('div',{class:'imrow',role:'listitem','aria-current':String(k===selImg),draggable:'true'});
    row.innerHTML='<span class="imh" title="Glisser pour réordonner">'+HANDLE+'</span>';
    const nm=el('button',{type:'button',class:'imname',text:im.name,title:im.name,onclick:()=>pick(k)});
    const del=el('button',{type:'button',class:'imdel'+(delArmed===im?' armed':''),text:delArmed===im?'?':'×','aria-label':'Supprimer '+im.name,onclick:e=>{ e.stopPropagation(); deleteImage(k); }});
    row.appendChild(nm); row.appendChild(del);
    row.addEventListener('dragstart',e=>{ dragFrom=k; row.classList.add('drag'); e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/plain',String(k)); });
    row.addEventListener('dragend',()=>{ row.classList.remove('drag'); });
    row.addEventListener('dragover',e=>{ if (dragFrom<0) return; e.preventDefault(); row.classList.add('over'); });
    row.addEventListener('dragleave',()=>row.classList.remove('over'));
    row.addEventListener('drop',e=>{ e.preventDefault(); e.stopPropagation(); row.classList.remove('over'); const f=dragFrom; dragFrom=-1; moveImage(f,k); });
    imgListEl.appendChild(row);
  });
  // bande du bas
  if (!strip) return;
  strip.innerHTML='';
  imgList.forEach((im,k)=>{
    if (!im.thumb){ const t=document.createElement('canvas'), s=140/Math.max(im.canvas.width,im.canvas.height); t.width=Math.max(1,Math.round(im.canvas.width*s)); t.height=Math.max(1,Math.round(im.canvas.height*s)); t.getContext('2d').drawImage(im.canvas,0,0,t.width,t.height); im.thumb=t.toDataURL('image/png'); }

    tile.appendChild(el('button',{type:'button',class:'st-pick','aria-label':'Afficher '+im.name,onclick:()=>pick(k)},[el('img',{src:im.thumb,alt:''})]));
    tile.appendChild(el('button',{type:'button',class:'st-del'+(delArmed===im?' armed':''),text:delArmed===im?'?':'×','aria-label':'Supprimer '+im.name,onclick:e=>{ e.stopPropagation(); deleteImage(k); }}));

    tile.addEventListener('dragstart',e=>{ dragFrom=k; e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/plain',String(k)); });
    tile.addEventListener('dragover',e=>{ if (dragFrom<0) return; e.preventDefault(); });
    tile.addEventListener('drop',e=>{ e.preventDefault(); e.stopPropagation(); const f=dragFrom; dragFrom=-1; moveImage(f,k); });
    strip.appendChild(tile);
  });
  strip.appendChild(el('span',{class:'st-sep','aria-hidden':'true'}));
  strip.appendChild(el('button',{type:'button',class:'st-add','aria-label':'Importer des images',title:'Importer des images',onclick:()=>fileIn.click()},[el('span',{text:'+'})]));

}

//  Export image haute qualité : rendu sur-échantillonné puis réduit en douceur,
//  dans un format optimisé (PNG sans perte, WebP léger, JPEG).
// ============================================================================
const EXPORT_SIZES=[['HD',1920],['2K',2560],['4K',3840],['6K',5760]];
const EXPORT_FMTS=[['PNG','png','image/png'],['WebP','webp','image/webp'],['JPEG','jpg','image/jpeg']];
function downscale(src,W,H){
  let c=src;
  while (c.width/2>=W*1.0 && c.height/2>=H*1.0){
    const t=document.createElement('canvas'); t.width=Math.round(c.width/2); t.height=Math.round(c.height/2);
    const x=t.getContext('2d'); x.imageSmoothingEnabled=true; x.imageSmoothingQuality='high'; x.drawImage(c,0,0,t.width,t.height); c=t;
  }
  return c;
}
async function exportImage(){
  const [lab,long]=EXPORT_SIZES[S.expSize|0], [fl,ext,type]=EXPORT_FMTS[S.expFmt|0];
  const w=VW, h=VH, ar=w/h;
  const W=ar>=1?long:Math.round(long*ar), H=ar>=1?Math.round(long/ar):long;
  const maxT=renderer.capabilities.maxTextureSize;
  // sur-échantillonnage ×2 quand la carte graphique le permet (bords nets, sans crénelage)
  const ss=Math.max(1, Math.min(2, Math.sqrt(36e6/(W*H)), maxT/Math.max(W,H)));
  const cv=await exportPNG(W*ss/w, true, true); if (!cv) return;
  const src=downscale(cv,W,H);
  const out=document.createElement('canvas'); out.width=W; out.height=H;
  const o=out.getContext('2d'); o.imageSmoothingEnabled=true; o.imageSmoothingQuality='high';
  if (S.expBg || ext==='jpg'){ o.fillStyle=HEX[S.bg]; o.fillRect(0,0,W,H); }
  o.drawImage(src,0,0,W,H);
  let blob=await new Promise(r=>out.toBlob(r,type, ext==='png'?undefined:(ext==='webp'?0.9:0.92)));
  let realExt=ext;
  if (!blob || (ext==='webp' && blob.type!=='image/webp')){ blob=await new Promise(r=>out.toBlob(r,'image/png')); realExt='png'; toast('Ce navigateur ne sait pas créer de WebP : export en PNG.'); }
  await saveFile(`brand-hub-co-labs-${stamp()}-${lab.toLowerCase()}.${realExt}`, blob);
  if (realExt===ext) toast(`${fl} ${W}×${H} · ${(blob.size/1048576).toFixed(1)} Mo`);
}

async function exportPNG(k, withInfo, asCanvas){
  const w=VW, h=VH, W=Math.round(w*k), H=Math.round(h*k);
  const maxT=renderer.capabilities.maxTextureSize;
  if (W>maxT||H>maxT){ toast('×'+k+' dépasse la taille maximale de ta carte graphique ('+maxT+' px).'); return; }
  toast('Rendu en cours…');
  await new Promise(r=>setTimeout(r,30));
  const rtA=new THREE.WebGLRenderTarget(W,H,{depthBuffer:false,stencilBuffer:false,minFilter:THREE.LinearFilter,magFilter:THREE.LinearFilter});
  const rtB=new THREE.WebGLRenderTarget(W,H,{depthBuffer:false,stencilBuffer:false});
  const shift=panelShift(w);
  camera.aspect=(w+shift)/h;
  if (shift) camera.setViewOffset((w+shift)*k,H,shift*k,0,W,H); else camera.clearViewOffset();
  camera.updateProjectionMatrix();
  const U=pillMat.uniforms, old={scale:U.uScale.value, pr:U.uPR.value};
  U.uScale.value=H/(2*Math.tan(THREE.MathUtils.degToRad(camera.fov)/2)); U.uPR.value=k;
  try{
    renderer.setRenderTarget(rtA); renderer.setClearColor(0x000000,0); renderer.clear();
    renderer.render(pillScene,camera);
    quadMat.uniforms.tMap.value=rtA.texture; quadMat.blending=THREE.NoBlending;
    renderer.setRenderTarget(rtB); renderer.setClearColor(0x000000,0); renderer.clear();
    renderer.render(quadScene,quadCam);
    const buf=new Uint8Array(W*H*4);
    renderer.readRenderTargetPixels(rtB,0,0,W,H,buf);
    const cv=document.createElement('canvas'); cv.width=W; cv.height=H;
    const ctx=cv.getContext('2d'), img=ctx.createImageData(W,H), row=W*4;
    for (let y=0;y<H;y++) img.data.set(buf.subarray((H-1-y)*row,(H-y)*row), y*row);
    ctx.putImageData(img,0,0);
    if (lastInfo && withInfo!==false) drawInfoCanvas(ctx, lastInfo, k);
    if (asCanvas) return cv;
    const blob=await new Promise(r=>cv.toBlob(r,'image/png'));
    await saveFile(`brand-hub-co-labs-${stamp()}-x${k}.png`, blob);
  } finally {
    quadMat.uniforms.tMap.value=rt.texture; quadMat.blending=THREE.NormalBlending;
    U.uScale.value=old.scale; U.uPR.value=old.pr;
    renderer.setRenderTarget(null); rtA.dispose(); rtB.dispose(); resize();
  }
}

function buildSVG(withBg, patternImg, noInfo){
  const w=VW, h=VH;
  camera.updateMatrixWorld();
  const scale=h/(2*Math.tan(THREE.MathUtils.degToRad(camera.fov)/2));
  const refZ=camera.position.distanceTo(orbit.target);
  const view=camera.matrixWorldInverse, proj=camera.projectionMatrix, v=new THREE.Vector3();
  const hex=(r,g,b)=>'#'+[r,g,b].map(x=>Math.round(Math.min(1,Math.max(0,x))*255).toString(16).padStart(2,'0')).join('');
  const bg=bgCol, fogK=S.fog;
  const shade=(c,z)=>{ if (fogK<=0.001) return hex(c[0],c[1],c[2]); let t=(z-lastFog.near)/(lastFog.far-lastFog.near); t=Math.min(1,Math.max(0,t)); t=t*t*(3-2*t)*fogK; return hex(c[0]+(bg[0]-c[0])*t,c[1]+(bg[1]-c[1])*t,c[2]+(bg[2]-c[2])*t); };
  const P=(arr,i)=>{ v.set(arr[i*3],arr[i*3+1],arr[i*3+2]).applyMatrix4(view); const z=-v.z; v.applyMatrix4(proj); return [(v.x+1)/2*w,(1-v.y)/2*h,z]; };
  const f1=x=>Math.round(x*10)/10;
  const out=[`<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">`];
  if (withBg) out.push(`<rect id="Fond" width="${w}" height="${h}" fill="${HEX[S.bg]}"/>`);
  if (patternImg){
    // motif rendu en image (fond transparent), l'infographie reste vectorielle par-dessus
    out.push(`<image id="Motif" x="0" y="0" width="${w}" height="${h}" preserveAspectRatio="none" href="${patternImg}" xlink:href="${patternImg}"/>`);
  } else {
  // fil : tracés continus, dans l'ordre où ils ont été générés
  out.push('<g id="Fil" fill="none" stroke-linecap="round" stroke-linejoin="round">');
  const gap2=(LSTEP*3)*(LSTEP*3);
  let pts=[], col=null, z0=0, prev=-1;
  const flush=()=>{ if (pts.length>1){ const sw=S.linePx*Math.min(1.6,Math.max(0.6,refZ/z0)); out.push(`<polyline stroke="${col}" stroke-width="${Math.round(sw*100)/100}" points="${pts.join(' ')}"/>`); } pts=[]; };
  for (let i=0;i<lastN;i++){
    if (sSeed[i]>=0){ continue; }
    if (prev>=0){
      const dx=sPos[i*3]-sPos[prev*3], dy=sPos[i*3+1]-sPos[prev*3+1], dz=sPos[i*3+2]-sPos[prev*3+2];
      if (dx*dx+dy*dy+dz*dz>gap2) flush();
    }
    const [x,y,z]=P(sPos,i);
    if (!pts.length){ z0=z; col=shade([sCol[i*3],sCol[i*3+1],sCol[i*3+2]],z); }
    pts.push(f1(x)+','+f1(y)); prev=i;
  }
  flush();
  out.push('</g>');
  // pastilles : de l'arrière vers l'avant
  out.push('<g id="Pastilles">');
  for (let i=0;i<lastN;i++){
    if (dSeed[i]<0) continue;
    const [x,y,z]=P(dPos,i);
